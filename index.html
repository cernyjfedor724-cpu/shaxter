<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Шахтёр PRO MAX</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;text-align:center}
.panel{padding:10px}
button{padding:10px;margin:5px;border:none;border-radius:10px;background:#333;color:#fff;width:90%}
.hidden{display:none}
.tab{display:flex;flex-wrap:wrap}
.tab button{flex:1}
.stat{background:#222;margin:5px;padding:10px;border-radius:10px}
</style>
</head>
<body>

<div class="stat">
💰 <span id="coins">0</span> |
⛏️ <span id="pick">1</span> кирка |
⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span>
</div>

<div class="tab">
<button onclick="tab('mine')">⛏️ Шахта</button>
<button onclick="tab('shop')">🛒 Магазин</button>
<button onclick="tab('pets')">🐾 Питомцы</button>
<button onclick="tab('other')">🎡 Азарт</button>
</div>

<!-- MINE -->
<div id="mine">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="upgrade()">🔨 Улучшить кирку</button>
<div id="log"></div>
</div>

<!-- SHOP -->
<div id="shop" class="hidden">
<button onclick="sell()">💰 Продать всё</button>
<button onclick="buyEnergy()">⚡ Энергия (50)</button>
</div>

<!-- PETS -->
<div id="pets" class="hidden">
<h3>🍵 Белый чай</h3>
<p>редкая руда ↑</p>
<button onclick="petUp('tea')">улучшить</button>

<h3>🐾 Пупуня</h3>
<p>монеты ↑</p>
<button onclick="petUp('pu')">улучшить</button>
</div>

<!-- OTHER -->
<div id="other" class="hidden">
<button onclick="spin()">🎡 колесо (50)</button>
</div>

<script>

let coins=100
let energy=100
let maxEnergy=100
let pickLevel=1

let inv={stone:0,iron:0,gold:0,diamond:0,mithril:0}

let pets={
tea:{lvl:0},
pu:{lvl:0}
}

// ---------- 100 КИРОК ----------
let PICKAXES=[]
for(let i=1;i<=100;i++){
PICKAXES.push({
lvl:i,
energy:Math.min(2+Math.floor(i/7),15),
rare:i*0.4
})
}

// ---------- SAVE ----------
function save(){
localStorage.setItem("g",JSON.stringify({coins,energy,maxEnergy,pickLevel,inv,pets}))
}
function load(){
let d=JSON.parse(localStorage.getItem("g"))
if(d){
coins=d.coins
energy=d.energy
maxEnergy=d.maxEnergy
pickLevel=d.pickLevel
inv=d.inv
pets=d.pets
}
}
load()

function update(){
document.getElementById("coins").innerText=coins
document.getElementById("energy").innerText=energy
document.getElementById("maxEnergy").innerText=maxEnergy
document.getElementById("pick").innerText=pickLevel
}
setInterval(update,500)

// ---------- РЕДКОСТЬ ----------
function rare(){
return pickLevel*0.3 + pets.tea.lvl*2
}

// ---------- КОПКА ----------
function mine(){

let pick=PICKAXES[pickLevel-1]

if(energy<pick.energy){
log("нет энергии")
return
}

energy-=pick.energy

let r=Math.random()*100 + rare()
let c=1

if(r<60){
inv.stone++
log("камень")
}
else if(r<80){
inv.iron++
log("железо")
}
else if(r<90){
inv.gold++
log("золото")
}
else if(r<97){
inv.diamond++
log("алмаз")
}
else{
inv.mithril++
log("МИФРИЛ")
}

save()
}

// ---------- УЛУЧШЕНИЕ КИРКИ ----------
function upgrade(){

if(pickLevel>=100){
log("макс кирка")
return
}

let cost=pickLevel*100

if(coins<cost){
log("нет денег")
return
}

coins-=cost
pickLevel++
maxEnergy+=5
energy=maxEnergy

log("новая кирка lvl "+pickLevel)

save()
}

// ---------- ПРОДАЖА ----------
function sell(){

let m=
inv.stone*1+
inv.iron*5+
inv.gold*15+
inv.diamond*50+
inv.mithril*200

m*=1+pets.pu.lvl*0.2

coins+=m
inv={stone:0,iron:0,gold:0,diamond:0,mithril:0}

log("продано "+m)
save()
}

// ---------- ЭНЕРГИЯ ----------
function buyEnergy(){
if(coins<50)return
coins-=50
energy=maxEnergy
save()
}

// ---------- ПИТОМЦЫ ----------
function petUp(p){
if(coins<200)return
coins-=200
pets[p].lvl++
save()
}

// ---------- КОЛЕСО ----------
function spin(){
if(coins<50)return
coins-=50

let r=Math.random()

if(r<0.3)coins+=100
else if(r<0.6)energy=maxEnergy
else inv.diamond++

save()
}

// ---------- TAB ----------
function tab(t){
["mine","shop","pets","other"].forEach(x=>{
document.getElementById(x).classList.add("hidden")
})
document.getElementById(t).classList.remove("hidden")
}

// ---------- LOG ----------
function log(t){
document.getElementById("log").innerText=t
}

</script>
</body>
</html>
