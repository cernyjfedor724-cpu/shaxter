<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Шахтёр: Эра Глубин</title>
    <!-- Подключаем шрифт для красоты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e1a;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }
        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .header {
            padding: 16px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .header .coins {
            font-size: 20px;
            font-weight: 700;
            color: #f7c948;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .coins span {
            font-size: 14px;
            color: #aaa;
            font-weight: 400;
        }
        .header .lang-toggle {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 4px;
        }
        .header .lang-toggle button {
            background: transparent;
            border: none;
            color: #aaa;
            font-weight: 600;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header .lang-toggle button.active {
            background: #f7c948;
            color: #0b0e1a;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 80px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        /* СТРАНИЦЫ (вкладки) */
        .page {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== КАРТОЧКИ ===== */
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.25s;
        }
        .card:hover {
            border-color: rgba(247, 201, 72, 0.2);
        }

        /* ===== ГЛАВНАЯ СТРАНИЦА (ШАХТА) ===== */
        .mine-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .mine-header h2 {
            font-size: 22px;
            font-weight: 700;
        }
        .mine-header .depth {
            color: #aaa;
            font-size: 14px;
        }

        /* Кнопка копать */
        .dig-btn {
            width: 100%;
            padding: 18px;
            font-size: 24px;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #f7c948, #f5a623);
            color: #0b0e1a;
            box-shadow: 0 8px 30px rgba(247, 201, 72, 0.3);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .dig-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(247, 201, 72, 0.2);
        }
        .dig-btn:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            pointer-events: none;
        }
        .dig-btn .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 0.6s ease-out forwards;
        }
        @keyframes sparkleAnim {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        /* Энергия */
        .energy-bar {
            margin: 16px 0;
            background: rgba(255,255,255,0.08);
            border-radius: 30px;
            height: 12px;
            overflow: hidden;
            position: relative;
        }
        .energy-bar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4dd0e1, #00bcd4);
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        .energy-bar .fill.low {
            background: linear-gradient(90deg, #e74c3c, #f39c12);
            animation: pulseRed 0.8s infinite alternate;
        }
        @keyframes pulseRed {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        .energy-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Инвентарь (руды) */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .ore-card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.2s;
        }
        .ore-card .icon {
            font-size: 28px;
            display: block;
        }
        .ore-card .name {
            font-size: 11px;
            color: #ccc;
            margin-top: 4px;
        }
        .ore-card .count {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
        }
        .ore-card.rare {
            border-color: rgba(247, 201, 72, 0.3);
        }
        .ore-card.epic {
            border-color: rgba(155, 89, 182, 0.3);
        }
        .ore-card.legendary {
            border-color: rgba(241, 196, 15, 0.5);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.15);
        }

        /* Кнопка продать всё */
        .sell-all-btn {
            margin-top: 14px;
            width: 100%;
            padding: 12px;
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 14px;
            color: #e74c3c;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .sell-all-btn:active {
            transform: scale(0.96);
            background: rgba(231, 76, 60, 0.3);
        }

        /* ===== СТРАНИЦА РЫНКА ===== */
        .market-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 4px;
        }
        .market-tabs button {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        .market-tabs button.active {
            background: rgba(247, 201, 72, 0.2);
            color: #f7c948;
        }

        .market-list .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .market-list .item:last-child {
            border-bottom: none;
        }
        .market-list .item .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .market-list .item .info .icon {
            font-size: 24px;
        }
        .market-list .item .price {
            color: #f7c948;
            font-weight: 600;
        }
        .market-list .item .actions button {
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 8px;
            padding: 4px 12px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            margin-left: 6px;
        }
        .market-list .item .actions button:active {
            transform: scale(0.92);
        }
        .market-list .item .actions .buy {
            background: rgba(76, 175, 80, 0.25);
            color: #4caf50;
        }
        .market-list .item .actions .sell {
            background: rgba(231, 76, 60, 0.25);
            color: #e74c3c;
        }

        /* Боты на рынке */
        .bot-offer {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #f7c948;
        }
        .bot-offer .bot-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bot-offer .bot-info .avatar {
            font-size: 28px;
        }
        .bot-offer .bot-info .desc {
            font-size: 14px;
        }
        .bot-offer .bot-info .desc small {
            color: #aaa;
            display: block;
            font-size: 12px;
        }
        .bot-offer .accept-btn {
            background: #f7c948;
            border: none;
            border-radius: 10px;
            padding: 6px 16px;
            font-weight: 700;
            color: #0b0e1a;
            cursor: pointer;
            transition: 0.2s;
        }
        .bot-offer .accept-btn:active {
            transform: scale(0.92);
        }

        /* ===== РАБОЧИЕ ===== */
        .worker-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .worker-card .info .name {
            font-weight: 600;
        }
        .worker-card .info .status {
            font-size: 12px;
            color: #aaa;
        }
        .worker-card .hire-btn {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 10px;
            padding: 4px 14px;
            color: #4caf50;
            font-weight: 600;
            cursor: pointer;
        }
        .worker-card .hire-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        /* ===== ПИТОМЦЫ ===== */
        .pets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .pet-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .pet-card .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
        }
        .pet-card .name {
            font-weight: 600;
            font-size: 14px;
        }
        .pet-card .bonus {
            font-size: 12px;
            color: #aaa;
            margin: 4px 0;
        }
        .pet-card .level {
            font-size: 12px;
            color: #f7c948;
        }
        .pet-card .upgrade-btn {
            margin-top: 8px;
            background: rgba(247, 201, 72, 0.15);
            border: none;
            border-radius: 10px;
            padding: 4px 12px;
            color: #f7c948;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== НАСТРОЙКИ ===== */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .settings-row .label {
            font-weight: 500;
        }
        .toggle {
            width: 48px;
            height: 28px;
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.25s;
        }
        .toggle.active {
            background: #f7c948;
        }
        .toggle .knob {
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.25s;
        }
        .toggle.active .knob {
            left: 23px;
        }
        .donate-btn {
            background: linear-gradient(135deg, #f7c948, #f5a623);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            color: #0b0e1a;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            margin: 10px 0;
            box-shadow: 0 4px 20px rgba(247, 201, 72, 0.2);
        }
        .reset-btn {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.2);
            border-radius: 14px;
            padding: 12px;
            color: #e74c3c;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }

        /* ===== НИЖНЕЕ МЕНЮ ===== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(11, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px 12px;
            border-radius: 12px;
            position: relative;
        }
        .nav-item .icon {
            font-size: 24px;
            line-height: 1;
        }
        .nav-item.active {
            color: #f7c948;
        }
        .nav-item.active .icon {
            transform: translateY(-2px);
        }
        .nav-item .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ===== ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 40px;
            color: #fff;
            font-weight: 500;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== СУНДУК (модалка) ===== */
        .chest-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        .chest-modal.open {
            display: flex;
        }
        .chest-content {
            background: linear-gradient(145deg, #1a1f33, #0b0e1a);
            border-radius: 30px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .chest-content .chest-icon {
            font-size: 60px;
            animation: chestBounce 0.6s infinite alternate;
        }
        @keyframes chestBounce {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
        .chest-content .reward {
            font-size: 22px;
            font-weight: 700;
            margin: 10px 0;
        }
        .chest-content .close-chest {
            margin-top: 16px;
            background: #f7c948;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: 700;
            color: #0b0e1a;
            cursor: pointer;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            #app {
                border-radius: 0;
                max-height: 100vh;
            }
            .content {
                padding: 12px 16px 80px;
            }
            .inventory-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .pets-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Верхняя панель -->
        <div class="header">
            <div class="coins">🪙 <span id="coinDisplay">0</span></div>
            <div class="lang-toggle">
                <button class="active" data-lang="ru">RU</button>
                <button data-lang="en">EN</button>
            </div>
        </div>

        <!-- Контент -->
        <div class="content" id="content">
            <!-- Страница Шахта -->
            <div class="page active" id="page-mine">
                <div class="mine-header">
                    <h2 id="mineTitle">⛏️ Шахта</h2>
                    <div class="depth" id="depthDisplay">Уровень: 1</div>
                </div>
                <button class="dig-btn" id="digBtn">⛏️ Копать</button>
                <div class="energy-bar">
                    <div class="fill" id="energyFill" style="width:100%"></div>
                </div>
                <div class="energy-label">
                    <span id="energyText">⚡ 100/100</span>
                    <span id="energyRegen">+3/сек</span>
                </div>

                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button id="upgradePickBtn" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px; color:#fff; font-weight:600;">🔨 Улучшить кирку</button>
                    <button id="upgradeMineBtn" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px; color:#fff; font-weight:600;">🏚️ Уровень шахты</button>
                </div>

                <div style="margin-top:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:600;">🎒 Инвентарь</span>
                        <span style="font-size:13px; color:#aaa;" id="inventoryCapacity">0/50</span>
                    </div>
                    <div class="inventory-grid" id="inventoryGrid"></div>
                    <button class="sell-all-btn" id="sellAllBtn">💰 Продать всё</button>
                </div>
            </div>

            <!-- Страница Рынок -->
            <div class="page" id="page-market">
                <div class="market-tabs">
                    <button class="active" data-mtab="exchange">📊 Биржа</button>
                    <button data-mtab="players">🤝 Игроки</button>
                    <button data-mtab="guild">🏛️ Гильдия</button>
                </div>
                <div id="marketContent">
                    <!-- Биржа -->
                    <div class="market-tab active" data-mtab="exchange">
                        <div class="market-list" id="exchangeList"></div>
                        <h4 style="margin:16px 0 8px;">🤖 Предложения ботов</h4>
                        <div id="botOffers"></div>
                    </div>
                    <!-- Игроки (P2P) -->
                    <div class="market-tab" data-mtab="players" style="display:none;">
                        <div style="margin-bottom:12px;">
                            <input type="text" id="playerOfferOre" placeholder="Руда (камень, железо...)" style="width:40%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                            <input type="number" id="playerOfferAmount" placeholder="Кол-во" style="width:25%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                            <input type="number" id="playerOfferPrice" placeholder="Цена" style="width:25%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                            <button id="publishOfferBtn" style="background:#f7c948; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#0b0e1a;">Выставить</button>
                        </div>
                        <div id="playerOffersList"></div>
                    </div>
                    <!-- Гильдия -->
                    <div class="market-tab" data-mtab="guild" style="display:none;">
                        <div style="margin-bottom:12px;">
                            <input type="text" id="guildNameInput" placeholder="Название гильдии" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; width:60%;">
                            <button id="createGuildBtn" style="background:#f7c948; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#0b0e1a;">Создать</button>
                        </div>
                        <div id="guildInfo">Гильдия не создана</div>
                        <div id="guildMembers"></div>
                        <div style="margin-top:12px;">
                            <h4>Обмен в гильдии</h4>
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <input type="text" id="guildTradeOre" placeholder="Руда" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; flex:1;">
                                <input type="number" id="guildTradeAmount" placeholder="Кол-во" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; flex:1;">
                                <button id="guildTradeBtn" style="background:#4caf50; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#fff;">Отдать</button>
                            </div>
                            <div id="guildStorage"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Страница Рабочие -->
            <div class="page" id="page-workers">
                <div id="workersList"></div>
            </div>

            <!-- Страница Питомцы -->
            <div class="page" id="page-pets">
                <div class="pets-grid" id="petsGrid"></div>
            </div>

            <!-- Страница Настройки -->
            <div class="page" id="page-settings">
                <div class="settings-row">
                    <span class="label">🌓 Тёмная тема</span>
                    <div class="toggle active" id="themeToggle"><div class="knob"></div></div>
                </div>
                <div class="settings-row">
                    <span class="label">📳 Вибрация</span>
                    <div class="toggle active" id="vibrationToggle"><div class="knob"></div></div>
                </div>
                <button class="donate-btn" id="donateBtn">⭐ Поддержать (Донат)</button>
                <button class="reset-btn" id="resetBtn">🗑️ Сбросить прогресс</button>
                <div style="margin-top:12px; text-align:center; color:#555; font-size:12px;">
                    <span id="totalClicks">Кликов: 0</span> · <span id="totalTime">Время: 0ч</span>
                </div>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="bottom-nav">
            <button class="nav-item active" data-page="mine"><span class="icon">🏠</span><span>Шахта</span></button>
            <button class="nav-item" data-page="market"><span class="icon">📊</span><span>Рынок</span></button>
            <button class="nav-item" data-page="workers"><span class="icon">👷</span><span>Рабочие</span></button>
            <button class="nav-item" data-page="pets"><span class="icon">🐾</span><span>Питомцы</span></button>
            <button class="nav-item" data-page="settings"><span class="icon">⚙️</span><span>Настройки</span></button>
        </div>

        <!-- Всплывающее уведомление -->
        <div class="toast" id="toast"></div>

        <!-- Модалка сундука -->
        <div class="chest-modal" id="chestModal">
            <div class="chest-content">
                <div class="chest-icon">🎁</div>
                <div class="reward" id="chestReward">+100 монет</div>
                <button class="close-chest" id="closeChest">Отлично!</button>
            </div>
        </div>
    </div>

    <script>
        // ======================================================================
        //  ПОЛНАЯ ЛОГИКА ИГРЫ (все механики + новые фичи)
        // ======================================================================

        // ----- ЯЗЫКИ -----
        const LANG = {
            ru: {
                mineTitle: '⛏️ Шахта',
                depth: 'Уровень:',
                dig: '⛏️ Копать',
                energy: '⚡',
                inventory: '🎒 Инвентарь',
                sellAll: '💰 Продать всё',
                market: '📊 Рынок',
                workers: '👷 Рабочие',
                pets: '🐾 Питомцы',
                settings: '⚙️ Настройки',
                donate: '⭐ Поддержать (Донат)',
                reset: '🗑️ Сбросить прогресс',
                // ... остальные тексты будут в коде
            },
            en: {
                mineTitle: '⛏️ Mine',
                depth: 'Level:',
                dig: '⛏️ Dig',
                energy: '⚡',
                inventory: '🎒 Inventory',
                sellAll: '💰 Sell all',
                market: '📊 Market',
                workers: '👷 Workers',
                pets: '🐾 Pets',
                settings: '⚙️ Settings',
                donate: '⭐ Support (Donate)',
                reset: '🗑️ Reset progress',
            }
        };

        // ----- СОСТОЯНИЕ ИГРЫ -----
        let game = {
            coins: 0,
            energy: 100,
            maxEnergy: 100,
            pickLevel: 1,
            mineLevel: 1,
            inventory: { камень: 0, железо: 0, золото: 0, алмаз: 0, мифрил: 0, платина: 0, рубин: 0, изумруд: 0, обсидиан: 0, опал: 0, звёздная_пыль: 0 },
            pickMutation: null, // 'fire','ice','gold'
            totalClicks: 0,
            totalTime: 0, // в секундах
            lastSave: Date.now(),
            boss: { hp: 50, maxHp: 50, timer: 0, active: false },
            marketPrices: {}, // динамические цены
            workers: [], // массив {type, level, speed, active}
            pets: {}, // {petId: level}
            guild: null, // {name, members: [], storage: {}}
            playerOffers: [], // лоты на продажу
            botOffers: [], // предложения ботов
            chestTimer: 0,
            effects: { doubleOre: 0, doubleSell: 0 },
            vibration: true,
            darkTheme: true,
            lang: 'ru',
        };

        // Список руд с параметрами
        const ORES = {
            камень: { icon: '🪨', rarity: 'common', basePrice: 2 },
            железо: { icon: '🔩', rarity: 'common', basePrice: 5 },
            золото: { icon: '🪙', rarity: 'uncommon', basePrice: 15 },
            алмаз: { icon: '💎', rarity: 'rare', basePrice: 50 },
            мифрил: { icon: '🔮', rarity: 'epic', basePrice: 150 },
            платина: { icon: '⚪', rarity: 'rare', basePrice: 80 },
            рубин: { icon: '❤️', rarity: 'epic', basePrice: 200 },
            изумруд: { icon: '💚', rarity: 'epic', basePrice: 220 },
            обсидиан: { icon: '🖤', rarity: 'legendary', basePrice: 350 },
            опал: { icon: '🌈', rarity: 'legendary', basePrice: 500 },
            звёздная_пыль: { icon: '✨', rarity: 'mythic', basePrice: 1200 },
        };

        // Рабочие типы
        const WORKER_TYPES = [
            { id: 'novice', name: 'Новичок', cost: 500, baseSpeed: 5, oreChance: { камень: 0.6, железо: 0.3, золото: 0.1 } },
            { id: 'miner', name: 'Шахтёр', cost: 2000, baseSpeed: 3, oreChance: { камень: 0.4, железо: 0.3, золото: 0.2, алмаз: 0.1 } },
            { id: 'brigadier', name: 'Бригадир', cost: 10000, baseSpeed: 2, oreChance: { камень: 0.2, железо: 0.2, золото: 0.2, алмаз: 0.2, мифрил: 0.1, платина: 0.05, рубин: 0.03, изумруд: 0.02 } },
            { id: 'engineer', name: 'Инженер', cost: 50000, baseSpeed: 1.2, oreChance: { камень: 0.1, железо: 0.1, золото: 0.15, алмаз: 0.2, мифрил: 0.15, платина: 0.1, рубин: 0.08, изумруд: 0.06, обсидиан: 0.04, опал: 0.02, звёздная_пыль: 0.005 } }
        ];

        // Питомцы
        const PETS = {
            salamander: { name: 'Огненный саламандр', icon: '🦎', bonus: 'Шанс мутации +10%', baseCost: 300, maxLevel: 5 },
            dragon: { name: 'Ледяной дракончик', icon: '🐉', bonus: 'Баффы +20% длительности', baseCost: 400, maxLevel: 5 },
            shadowcat: { name: 'Теневой кот', icon: '🐈‍⬛', bonus: 'Скрытые комнаты +15%', baseCost: 350, maxLevel: 5 },
            goldbeetle: { name: 'Золотой жук', icon: '🐞', bonus: 'Монеты +5%', baseCost: 500, maxLevel: 5 },
        };

        // ----- ЗАГРУЗКА / СОХРАНЕНИЕ -----
        function saveGame() {
            game.lastSave = Date.now();
            localStorage.setItem('shaxterSave', JSON.stringify(game));
        }

        function loadGame() {
            const raw = localStorage.getItem('shaxterSave');
            if (raw) {
                try {
                    const saved = JSON.parse(raw);
                    // Мержим с дефолтами, чтобы новые поля не потерялись
                    for (let key in saved) {
                        if (game.hasOwnProperty(key)) {
                            if (typeof game[key] === 'object' && game[key] !== null && !Array.isArray(game[key])) {
                                game[key] = { ...game[key], ...saved[key] };
                            } else {
                                game[key] = saved[key];
                            }
                        }
                    }
                    // Восстанавливаем энергию за время отсутствия
                    const diff = (Date.now() - game.lastSave) / 1000;
                    const regen = diff * 3;
                    game.energy = Math.min(game.maxEnergy, game.energy + regen);
                    // Офлайн-добыча рабочих
                    if (game.workers.length > 0) {
                        let offlineOre = {};
                        game.workers.forEach(w => {
                            const speed = w.speed || WORKER_TYPES.find(t => t.id === w.type).baseSpeed;
                            const cycles = Math.floor(diff / speed);
                            for (let i = 0; i < cycles; i++) {
                                const ore = pickOreByChance(w.oreChance || WORKER_TYPES.find(t => t.id === w.type).oreChance);
                                if (ore) {
                                    offlineOre[ore] = (offlineOre[ore] || 0) + 1;
                                }
                            }
                        });
                        for (let ore in offlineOre) {
                            if (game.inventory[ore] !== undefined) {
                                game.inventory[ore] += offlineOre[ore];
                            }
                        }
                        // Можно показать уведомление, но мы это сделаем через тост
                        if (Object.keys(offlineOre).length > 0) {
                            showToast('⛏️ Рабочие накопали ресурсов за время отсутствия!');
                        }
                    }
                    saveGame();
                } catch(e) { /* игнорим */ }
            }
        }

        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function pickOreByChance(chances) {
            const r = Math.random();
            let cum = 0;
            for (let ore in chances) {
                cum += chances[ore];
                if (r <= cum) return ore;
            }
            return 'камень';
        }

        function getOrePrice(ore) {
            const base = ORES[ore]?.basePrice || 1;
            const market = game.marketPrices[ore] || 1;
            return Math.floor(base * market);
        }

        function getInventoryTotal() {
            let sum = 0;
            for (let ore in game.inventory) sum += game.inventory[ore];
            return sum;
        }

        function getMaxInventory() {
            return 50 + game.mineLevel * 10;
        }

        // ----- ТОСТ (уведомления) -----
        let toastTimeout;

        function showToast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // ----- ОТОБРАЖЕНИЕ ИНТЕРФЕЙСА -----
        function renderAll() {
            renderCoins();
            renderEnergy();
            renderInventory();
            renderMineInfo();
            renderMarketExchange();
            renderBotOffers();
            renderWorkers();
            renderPets();
            renderSettings();
            renderPlayerOffers();
            renderGuild();
            renderBottomNav();
            saveGame();
        }

        function renderCoins() {
            document.getElementById('coinDisplay').textContent = Math.floor(game.coins);
        }

        function renderEnergy() {
            const fill = document.getElementById('energyFill');
            const pct = (game.energy / game.maxEnergy) * 100;
            fill.style.width = Math.min(100, pct) + '%';
            if (pct < 20) fill.classList.add('low');
            else fill.classList.remove('low');
            document.getElementById('energyText').textContent = `⚡ ${Math.floor(game.energy)}/${game.maxEnergy}`;
            document.getElementById('digBtn').disabled = (game.energy < 1 || getInventoryTotal() >= getMaxInventory());
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';
            let total = 0;
            for (let ore in game.inventory) {
                const count = game.inventory[ore];
                if (count > 0) {
                    total += count;
                    const div = document.createElement('div');
                    div.className = 'ore-card';
                    const rarity = ORES[ore]?.rarity || 'common';
                    if (rarity === 'rare') div.classList.add('rare');
                    if (rarity === 'epic') div.classList.add('epic');
                    if (rarity === 'legendary' || rarity === 'mythic') div.classList.add('legendary');
                    div.innerHTML = `
                        <span class="icon">${ORES[ore]?.icon || '🪨'}</span>
                        <div class="name">${ore}</div>
                        <div class="count">${count}</div>
                    `;
                    grid.appendChild(div);
                }
            }
            document.getElementById('inventoryCapacity').textContent = `${total}/${getMaxInventory()}`;
        }

        function renderMineInfo() {
            document.getElementById('depthDisplay').textContent = `Уровень: ${game.mineLevel}`;
            // Кирка мутация
            let mutationText = '';
            if (game.pickMutation === 'fire') mutationText = '🔥';
            else if (game.pickMutation === 'ice') mutationText = '❄️';
            else if (game.pickMutation === 'gold') mutationText = '⭐';
            document.getElementById('mineTitle').innerHTML = `⛏️ Шахта ${mutationText}`;
        }

        function renderMarketExchange() {
            const list = document.getElementById('exchangeList');
            list.innerHTML = '';
            for (let ore in ORES) {
                const price = getOrePrice(ore);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="info">
                        <span class="icon">${ORES[ore].icon}</span>
                        <span>${ore}</span>
                    </div>
                    <div class="price">${price} 🪙</div>
                    <div class="actions">
                        <button class="buy" data-ore="${ore}">Купить</button>
                        <button class="sell" data-ore="${ore}">Продать</button>
                    </div>
                `;
                list.appendChild(div);
            }
            // Обработчики покупки/продажи
            list.querySelectorAll('.buy').forEach(btn => {
                btn.addEventListener('click', () => {
                    const ore = btn.dataset.ore;
                    const price = getOrePrice(ore);
                    if (game.coins >= price) {
                        game.coins -= price;
                        game.inventory[ore] = (game.inventory[ore] || 0) + 1;
                        showToast(`Куплен ${ore} за ${price} монет`);
                        renderAll();
                    } else {
                        showToast('❌ Недостаточно монет');
                    }
                });
            });
            list.querySelectorAll('.sell').forEach(btn => {
                btn.addEventListener('click', () => {
                    const ore = btn.dataset.ore;
                    if (game.inventory[ore] > 0) {
                        const price = getOrePrice(ore);
                        game.inventory[ore]--;
                        game.coins += price;
                        showToast(`Продан ${ore} за ${price} монет`);
                        renderAll();
                    } else {
                        showToast('❌ Нет руды для продажи');
                    }
                });
            });
        }

        function renderBotOffers() {
            const container = document.getElementById('botOffers');
            container.innerHTML = '';
            // Генерируем ботов, если их нет
            if (game.botOffers.length === 0) {
                // Создаём 3 случайных предложения
                const oreKeys = Object.keys(ORES);
                for (let i = 0; i < 3; i++) {
                    const ore = oreKeys[Math.floor(Math.random() * oreKeys.length)];
                    const amount = Math.floor(Math.random() * 5) + 1;
                    const price = getOrePrice(ore) * amount * (0.8 + Math.random() * 0.4);
                    game.botOffers.push({
                        ore,
                        amount,
                        price: Math.floor(price),
                        botName: ['Торговец', 'Купец', 'Барыга', 'Спекулянт'][i],
                        avatar: ['🧑‍💼', '👨‍💼', '👩‍💼', '🤵'][i],
                        expires: Date.now() + 60000 // 1 минута
                    });
                }
            }
            // Отображаем активные
            const now = Date.now();
            game.botOffers = game.botOffers.filter(b => b.expires > now);
            game.botOffers.forEach((offer, idx) => {
                const div = document.createElement('div');
                div.className = 'bot-offer';
                div.innerHTML = `
                    <div class="bot-info">
                        <span class="avatar">${offer.avatar}</span>
                        <div class="desc">
                            <strong>${offer.botName}</strong>
                            <small>Покупает ${offer.amount} ${offer.ore} за ${offer.price} 🪙</small>
                        </div>
                    </div>
                    <button class="accept-btn" data-idx="${idx}">Принять</button>
                `;
                container.appendChild(div);
            });
            // Обработчики принятия
            container.querySelectorAll('.accept-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    const offer = game.botOffers[idx];
                    if (offer && game.inventory[offer.ore] >= offer.amount) {
                        game.inventory[offer.ore] -= offer.amount;
                        game.coins += offer.price;
                        game.botOffers.splice(idx, 1);
                        showToast(`✅ Продано ${offer.amount} ${offer.ore} боту за ${offer.price} монет`);
                        renderAll();
                    } else {
                        showToast('❌ Недостаточно руды');
                    }
                });
            });
        }

        function renderWorkers() {
            const container = document.getElementById('workersList');
            container.innerHTML = '';
            // Сначала показываем доступные для найма
            WORKER_TYPES.forEach(wt => {
                const existing = game.workers.find(w => w.type === wt.id);
                const level = existing ? existing.level : 0;
                const speed = existing ? wt.baseSpeed / (1 + level * 0.1) : wt.baseSpeed;
                const div = document.createElement('div');
                div.className = 'worker-card';
                div.innerHTML = `
                    <div class="info">
                        <div class="name">${wt.name} ${level > 0 ? '⭐'.repeat(Math.min(level, 5)) : ''}</div>
                        <div class="status">Скорость: ${speed.toFixed(1)} сек/руда · Ур. ${level}</div>
                    </div>
                    <button class="hire-btn" data-type="${wt.id}" ${existing ? 'disabled' : ''}>${existing ? 'Нанят' : `Нанять ${wt.cost}🪙`}</button>
                `;
                container.appendChild(div);
            });
            // Обработчики найма
            container.querySelectorAll('.hire-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    const wt = WORKER_TYPES.find(t => t.id === type);
                    if (game.coins >= wt.cost) {
                        game.coins -= wt.cost;
                        game.workers.push({ type: wt.id, level: 0, speed: wt.baseSpeed, oreChance: { ...wt.oreChance } });
                        showToast(`👷 ${wt.name} нанят!`);
                        renderAll();
                    } else {
                        showToast('❌ Недостаточно монет');
                    }
                });
            });
            // Отображаем улучшение для нанятых
            game.workers.forEach((w, idx) => {
                const wt = WORKER_TYPES.find(t => t.id === w.type);
                const upgradeCost = Math.floor(wt.cost * 0.5 * (w.level + 1));
                const div = document.createElement('div');
                div.className = 'worker-card';
                div.innerHTML = `
                    <div class="info">
                        <div class="name">${wt.name} ⭐${w.level}</div>
                        <div class="status">Скорость: ${(wt.baseSpeed / (1 + w.level * 0.1)).toFixed(1)} сек/руда</div>
                    </div>
                    <button class="hire-btn" data-idx="${idx}">Улучшить ${upgradeCost}🪙</button>
                `;
                container.appendChild(div);
            });
            container.querySelectorAll('.hire-btn[data-idx]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    const w = game.workers[idx];
                    const wt = WORKER_TYPES.find(t => t.id === w.type);
                    const cost = Math.floor(wt.cost * 0.5 * (w.level + 1));
                    if (game.coins >= cost) {
                        game.coins -= cost;
                        w.level++;
                        w.speed = wt.baseSpeed / (1 + w.level * 0.1);
                        // Увеличиваем шанс редких руд
                        for (let ore in w.oreChance) {
                            w.oreChance[ore] *= 1.05;
                        }
                        showToast(`⭐ ${wt.name} улучшен до ${w.level} уровня!`);
                        renderAll();
                    } else {
                        showToast('❌ Недостаточно монет');
                    }
                });
            });
        }

        function renderPets() {
            const grid = document.getElementById('petsGrid');
            grid.innerHTML = '';
            for (let id in PETS) {
                const pet = PETS[id];
                const level = game.pets[id] || 0;
                const maxLevel = pet.maxLevel || 5;
                const cost = Math.floor(pet.baseCost * (level + 1) * 1.2);
                const div = document.createElement('div');
                div.className = 'pet-card';
                div.innerHTML = `
                    <span class="icon">${pet.icon}</span>
                    <div class="name">${pet.name}</div>
                    <div class="bonus">${pet.bonus}</div>
                    <div class="level">Ур. ${level}/${maxLevel}</div>
                    ${level < maxLevel ? `<button class="upgrade-btn" data-pet="${id}">Улучшить ${cost}🪙</button>` : '<span style="color:#f7c948;">MAX</span>'}
                `;
                grid.appendChild(div);
            }
            grid.querySelectorAll('.upgrade-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.pet;
                    const level = game.pets[id] || 0;
                    const pet = PETS[id];
                    const cost = Math.floor(pet.baseCost * (level + 1) * 1.2);
                    if (game.coins >= cost && level < pet.maxLevel) {
                        game.coins -= cost;
                        game.pets[id] = (game.pets[id] || 0) + 1;
                        showToast(`🐾 ${pet.name} улучшен!`);
                        renderAll();
                    } else {
                        showToast('❌ Недостаточно монет или достигнут максимум');
                    }
                });
            });
        }

        function renderPlayerOffers() {
            const container = document.getElementById('playerOffersList');
            container.innerHTML = '';
            // Отображаем лоты игрока
            game.playerOffers.forEach((offer, idx) => {
                const div = document.createElement('div');
                div.className = 'bot-offer';
                div.innerHTML = `
                    <div class="bot-info">
                        <span class="avatar">🧑‍🌾</span>
                        <div class="desc">
                            <strong>Ваш лот</strong>
                            <small>${offer.amount} ${offer.ore} по ${offer.price} 🪙 за шт.</small>
                        </div>
                    </div>
                    <button class="accept-btn" data-idx="${idx}" style="background:#e74c3c;">Снять</button>
                `;
                container.appendChild(div);
            });
            container.querySelectorAll('.accept-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    game.playerOffers.splice(idx, 1);
                    showToast('Лот снят');
                    renderAll();
                });
            });
            // Симуляция покупки ботами (каждые 30 сек)
            if (game.playerOffers.length > 0 && Math.random() < 0.2) {
                // случайный бот покупает
                const idx = Math.floor(Math.random() * game.playerOffers.length);
                const offer = game.playerOffers[idx];
                if (offer) {
                    // Бот покупает, если есть спрос
                    game.coins += offer.price * offer.amount;
                    game.playerOffers.splice(idx, 1);
                    showToast(`🤖 Бот купил ваш лот! +${offer.price * offer.amount} монет`);
                    renderAll();
                }
            }
        }

        function renderGuild() {
            const info = document.getElementById('guildInfo');
            const members = document.getElementById('guildMembers');
            const storage = document.getElementById('guildStorage');
            if (game.guild) {
                info.textContent = `🏛️ Гильдия: ${game.guild.name} (участников: ${game.guild.members.length})`;
                members.innerHTML = game.guild.members.map(m => `👤 ${m}`).join(' ');
                // Отображаем склад
                let html = '<div style="display:flex; flex-wrap:wrap; gap:6px;">';
                for (let ore in game.guild.storage) {
                    if (game.guild.storage[ore] > 0) {
                        html += `<span style="background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:20px;">${ORES[ore]?.icon} ${ore}: ${game.guild.storage[ore]}</span>`;
                    }
                }
                html += '</div>';
                storage.innerHTML = html;
            } else {
                info.textContent = 'Гильдия не создана';
                members.innerHTML = '';
                storage.innerHTML = '';
            }
        }

        function renderSettings() {
            document.getElementById('themeToggle').classList.toggle('active', game.darkTheme);
            document.getElementById('vibrationToggle').classList.toggle('active', game.vibration);
            document.getElementById('totalClicks').textContent = `Кликов: ${game.totalClicks}`;
            const hours = Math.floor(game.totalTime / 3600);
            const mins = Math.floor((game.totalTime % 3600) / 60);
            document.getElementById('totalTime').textContent = `Время: ${hours}ч ${mins}м`;
        }

        function renderBottomNav() {
            // активная вкладка уже устанавливается при клике
        }

        // ----- ОСНОВНЫЕ ИГРОВЫЕ ДЕЙСТВИЯ -----
        function dig() {
            if (game.energy < 1 || getInventoryTotal() >= getMaxInventory()) return;
            game.energy--;
            game.totalClicks++;

            // Шанс сундука 3%
            if (Math.random() < 0.03) {
                openChest();
            }

            // Определяем добычу
            let ore = 'камень';
            const r = Math.random();
            let chances = getOreChances();
            let cum = 0;
            for (let o in chances) {
                cum += chances[o];
                if (r <= cum) { ore = o; break; }
            }

            // Множитель от кирки
            let multiplier = 1 + game.pickLevel * 0.1;
            // Мутации
            if (game.pickMutation === 'fire') {
                // больше шанс на редкие
                if (['алмаз','мифрил','платина','рубин','изумруд','обсидиан','опа','звёздная_пыль'].includes(ore)) {
                    multiplier *= 1.5;
                }
            } else if (game.pickMutation === 'ice') {
                // больше шанс на обычные, но множитель выше
                multiplier *= 1.3;
            } else if (game.pickMutation === 'gold') {
                multiplier *= 1.8;
                game.coins += Math.floor(Math.random() * 5);
            }

            const count = Math.floor(1 + Math.random() * multiplier);
            game.inventory[ore] = (game.inventory[ore] || 0) + count;

            // Визуальный эффект искр
            spawnSparks();

            // Показать всплывающую подсказку
            showToast(`+${count} ${ORES[ore]?.icon || '🪨'} ${ore}`);

            // Обновляем интерфейс
            renderAll();
            saveGame();
        }

        function getOreChances() {
            // База зависит от уровня шахты и кирки
            let base = {
                камень: 0.3,
                железо: 0.25,
                золото: 0.2,
                алмаз: 0.1,
                мифрил: 0.05,
                платина: 0.04,
                рубин: 0.03,
                изумруд: 0.02,
                обсидиан: 0.01,
                опал: 0.005,
                звёздная_пыль: 0.001
            };
            // Увеличиваем шансы редких с уровнем шахты
            const bonus = game.mineLevel * 0.02;
            for (let ore in base) {
                if (['алмаз','мифрил','платина','рубин','изумруд','обсидиан','опа','звёздная_пыль'].includes(ore)) {
                    base[ore] += bonus;
                }
            }
            // Нормализация
            let sum = 0;
            for (let o in base) sum += base[o];
            for (let o in base) base[o] /= sum;
            return base;
        }

        function spawnSparks() {
            const btn = document.getElementById('digBtn');
            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'sparkle';
                const angle = Math.random() * 2 * Math.PI;
                const dist = 40 + Math.random() * 80;
                spark.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                spark.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                spark.style.left = (50 + (Math.random() - 0.5) * 20) + '%';
                spark.style.top = (50 + (Math.random() - 0.5) * 20) + '%';
                btn.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function openChest() {
            const modal = document.getElementById('chestModal');
            modal.classList.add('open');
            // Награда
            const rewards = [
                { text: '+100 монет', action: () => game.coins += 100 },
                { text: '+1 алмаз', action: () => game.inventory.алмаз = (game.inventory.алмаз || 0) + 1 },
                { text: '+1 мифрил', action: () => game.inventory.мифрил = (game.inventory.мифрил || 0) + 1 },
                { text: '+5 платины', action: () => game.inventory.платина = (game.inventory.платина || 0) + 5 },
                { text: '+1 звёздная пыль', action: () => game.inventory.звёздная_пыль = (game.inventory.звёздная_пыль || 0) + 1 },
                { text: '+500 монет', action: () => game.coins += 500 },
            ];
            const chosen = rewards[Math.floor(Math.random() * rewards.length)];
            document.getElementById('chestReward').textContent = chosen.text;
            chosen.action();
            renderAll();
            saveGame();
            document.getElementById('closeChest').onclick = () => {
                modal.classList.remove('open');
            };
        }

        // ----- УЛУЧШЕНИЯ -----
        function upgradePick() {
            const cost = Math.floor(100 * Math.pow(1.5, game.pickLevel));
            if (game.coins >= cost) {
                game.coins -= cost;
                game.pickLevel++;
                // Мутация с шансом 5%
                if (Math.random() < 0.05) {
                    const mutations = ['fire', 'ice', 'gold'];
                    game.pickMutation = mutations[Math.floor(Math.random() * mutations.length)];
                    showToast(`✨ Кирка стала ${game.pickMutation === 'fire' ? 'Огненной' : game.pickMutation === 'ice' ? 'Ледяной' : 'Золотой'}!`);
                }
                showToast(`🔨 Кирка улучшена до ${game.pickLevel} уровня`);
                renderAll();
            } else {
                showToast('❌ Недостаточно монет');
            }
        }

        function upgradeMine() {
            const cost = Math.floor(200 * Math.pow(1.6, game.mineLevel));
            if (game.coins >= cost) {
                game.coins -= cost;
                game.mineLevel++;
                showToast(`🏚️ Шахта улучшена до ${game.mineLevel} уровня`);
                renderAll();
            } else {
                showToast('❌ Недостаточно монет');
            }
        }

        function sellAll() {
            let total = 0;
            for (let ore in game.inventory) {
                if (game.inventory[ore] > 0) {
                    const price = getOrePrice(ore);
                    total += game.inventory[ore] * price;
                    game.inventory[ore] = 0;
                }
            }
            if (total > 0) {
                // Налог 5%
                total = Math.floor(total * 0.95);
                game.coins += total;
                showToast(`💰 Продано на ${total} монет`);
                renderAll();
            } else {
                showToast('❌ Инвентарь пуст');
            }
        }

        // ----- РЫНОЧНЫЕ ЦЕНЫ (динамика) -----
        function updateMarketPrices() {
            for (let ore in ORES) {
                const base = ORES[ore].basePrice;
                const variation = 0.8 + Math.random() * 0.4; // ±20%
                game.marketPrices[ore] = Math.max(0.5, variation);
            }
        }

        // ----- БОСС -----
        function bossTick() {
            if (game.boss.active) {
                // Босс существует, но мы не реализовали механику боя детально, оставим как есть
                // Пока просто уменьшаем таймер
                game.boss.timer--;
                if (game.boss.timer <= 0) {
                    game.boss.active = false;
                    showToast('👾 Босс исчез!');
                }
            } else {
                // Появление каждые 20 минут (1200 сек)
                if (Math.random() < 0.001) { // для теста ускорим, можно изменить
                    game.boss.active = true;
                    game.boss.hp = 50;
                    game.boss.maxHp = 50;
                    game.boss.timer = 1200;
                    showToast('👾 Босс появился! Атакуйте!');
                }
            }
        }

        // ----- РАБОЧИЕ АКТИВНОСТЬ (в фоне) -----
        let workerInterval = setInterval(() => {
            game.workers.forEach(w => {
                const wt = WORKER_TYPES.find(t => t.id === w.type);
                const speed = wt.baseSpeed / (1 + w.level * 0.1);
                if (Math.random() < 1 / speed) {
                    const ore = pickOreByChance(w.oreChance);
                    if (ore && getInventoryTotal() < getMaxInventory()) {
                        game.inventory[ore] = (game.inventory[ore] || 0) + 1;
                    }
                }
            });
            renderAll();
            saveGame();
        }, 1000);

        // ----- ВОССТАНОВЛЕНИЕ ЭНЕРГИИ -----
        setInterval(() => {
            if (game.energy < game.maxEnergy) {
                game.energy = Math.min(game.maxEnergy, game.energy + 3);
                renderEnergy();
                saveGame();
            }
        }, 1000);

        // ----- ОБНОВЛЕНИЕ РЫНКА КАЖДЫЕ 10 МИНУТ -----
        setInterval(() => {
            updateMarketPrices();
            showToast('📊 Цены на рынке обновлены!');
            renderAll();
        }, 600000);

        // ----- ОБНОВЛЕНИЕ БОТОВ -----
        setInterval(() => {
            // Удаляем старые предложения ботов и генерируем новые
            game.botOffers = game.botOffers.filter(b => b.expires > Date.now());
            if (game.botOffers.length < 5) {
                const oreKeys = Object.keys(ORES);
                const ore = oreKeys[Math.floor(Math.random() * oreKeys.length)];
                const amount = Math.floor(Math.random() * 5) + 1;
                const price = getOrePrice(ore) * amount * (0.8 + Math.random() * 0.4);
                game.botOffers.push({
                    ore,
                    amount,
                    price: Math.floor(price),
                    botName: ['Торговец', 'Купец', 'Барыга', 'Спекулянт'][Math.floor(Math.random() * 4)],
                    avatar: ['🧑‍💼', '👨‍💼', '👩‍💼', '🤵'][Math.floor(Math.random() * 4)],
                    expires: Date.now() + 60000
                });
                renderAll();
            }
        }, 30000);

        // ----- НАВИГАЦИЯ (нижнее меню) -----
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                const page = item.dataset.page;
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + page).classList.add('active');
                renderAll();
            });
        });

        // ----- ВКЛАДКИ РЫНКА -----
        document.querySelectorAll('.market-tabs button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.market-tabs button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.mtab;
                document.querySelectorAll('.market-tab').forEach(t => t.style.display = 'none');
                document.querySelector(`.market-tab[data-mtab="${tab}"]`).style.display = 'block';
            });
        });

        // ----- ОБРАБОТЧИКИ КНОПОК -----
        document.getElementById('digBtn').addEventListener('click', dig);
        document.getElementById('upgradePickBtn').addEventListener('click', upgradePick);
        document.getElementById('upgradeMineBtn').addEventListener('click', upgradeMine);
        document.getElementById('sellAllBtn').addEventListener('click', sellAll);

        // Настройки
        document.getElementById('themeToggle').addEventListener('click', function() {
            game.darkTheme = !game.darkTheme;
            document.body.style.background = game.darkTheme ? '#0b0e1a' : '#f0f2f5';
            document.getElementById('app').style.background = game.darkTheme ? 'linear-gradient(145deg, #0b0e1a, #1a1f33)' : '#ffffff';
            renderAll();
        });
        document.getElementById('vibrationToggle').addEventListener('click', function() {
            game.vibration = !game.vibration;
            renderAll();
        });

        // Донат (заглушка)
        document.getElementById('donateBtn').addEventListener('click', () => {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.openInvoice('', (status) => {
                    if (status === 'paid') {
                        game.coins += 5000;
                        game.inventory.алмаз = (game.inventory.алмаз || 0) + 10;
                        showToast('⭐ Спасибо за поддержку! +5000 монет и 10 алмазов');
                        renderAll();
                    }
                });
            } else {
                // Симуляция для теста
                if (confirm('Симуляция доната: получить 5000 монет и 10 алмазов?')) {
                    game.coins += 5000;
                    game.inventory.алмаз = (game.inventory.алмаз || 0) + 10;
                    showToast('⭐ Донат принят (симуляция)');
                    renderAll();
                }
            }
        });

        // Сброс
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Удалить весь прогресс?')) {
                localStorage.removeItem('shaxterSave');
                location.reload();
            }
        });

        // Выставить лот (P2P)
        document.getElementById('publishOfferBtn').addEventListener('click', () => {
            const ore = document.getElementById('playerOfferOre').value.trim();
            const amount = parseInt(document.getElementById('playerOfferAmount').value);
            const price = parseInt(document.getElementById('playerOfferPrice').value);
            if (!ore || !amount || !price) return showToast('Заполните все поля');
            if (game.inventory[ore] >= amount) {
                game.inventory[ore] -= amount;
                game.playerOffers.push({ ore, amount, price });
                showToast('✅ Лот выставлен на продажу');
                renderAll();
            } else {
                showToast('❌ Недостаточно руды');
            }
        });

        // Гильдия
        document.getElementById('createGuildBtn').addEventListener('click', () => {
            const name = document.getElementById('guildNameInput').value.trim();
            if (!name) return showToast('Введите название');
            if (game.guild) return showToast('Гильдия уже создана');
            game.guild = { name, members: ['Игрок'], storage: {} };
            showToast(`🏛️ Гильдия "${name}" создана!`);
            renderAll();
        });

        document.getElementById('guildTradeBtn').addEventListener('click', () => {
            if (!game.guild) return showToast('Сначала создайте гильдию');
            const ore = document.getElementById('guildTradeOre').value.trim();
            const amount = parseInt(document.getElementById('guildTradeAmount').value);
            if (!ore || !amount) return showToast('Заполните поля');
            if (game.inventory[ore] >= amount) {
                game.inventory[ore] -= amount;
                game.guild.storage[ore] = (game.guild.storage[ore] || 0) + amount;
                showToast(`📦 ${amount} ${ore} отправлено на склад гильдии`);
                renderAll();
            } else {
                showToast('❌ Недостаточно руды');
            }
        });

        // ----- ИНИЦИАЛИЗАЦИЯ -----
        loadGame();
        updateMarketPrices();
        // Запускаем таймер времени
        setInterval(() => {
            game.totalTime++;
            renderAll();
        }, 1000);
        renderAll();

        // Автосохранение каждые 15 сек
        setInterval(saveGame, 15000);

        console.log('⛏️ Шахтёр: Эра Глубин загружен!');
    </script>
