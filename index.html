<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏ Miner PRO Stable</title>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;text-align:center}
.panel{display:none;padding:10px}
.active{display:block}
button{margin:5px;padding:10px;border:0;border-radius:8px;background:#333;color:#fff}
.tab{display:flex}
.tab button{flex:1}
.card{background:#222;padding:10px;margin:5px;border-radius:10px}
</style>
</head>

<body>

<h3>⛏ MINER PRO STABLE</h3>

<div class="tab">
<button onclick="show('mine')">Шахта</button>
<button onclick="show('pets')">Питомцы</button>
<button onclick="show('shop')">Магазин</button>
<button onclick="show('market')">Рынок</button>
</div>

<!-- ШАХТА -->
<div id="mine" class="panel active">
<div>💰 <span id="coins">0</span></div>
<div>⚡ <span id="energy">100</span></div>
<div>🔨 Кирка: <span id="pick"></span></div>

<button onclick="mine()">⛏ Копать</button>
<button onclick="upgrade()">⬆ Улучшить (<span id="cost"></span>)</button>
<button onclick="sell()">💸 Продать всё</button>
</div>

<!-- ПИТОМЦЫ -->
<div id="pets" class="panel">
<div class="card">
🍵 Чай LVL <span id="p1"></span><br>
<button onclick="pet(1)">Купить/улучшить</button>
</div>

<div class="card">
🐾 Пупуня LVL <span id="p2"></span><br>
<button onclick="pet(2)">Купить/улучшить</button>
</div>
</div>

<!-- МАГАЗИН -->
<div id="shop" class="panel">
<button onclick="energyBuy()">Восстановить энергию (50)</button>
</div>

<!-- РЫНОК -->
<div id="market" class="panel">
<div>Камень: 2</div>
<div>Золото: 10</div>
</div>

<script>
let coins=100;
let energy=100;
let pick=1;

let inv={stone:0,gold:0};
let pets={1:0,2:0};

const picks=[];
for(let i=1;i<=100;i++){
picks.push({
energy:1+Math.floor(i/10),
rare:Math.min(i*0.005,0.5)
});
}

function current(){return picks[pick-1];}

function show(t){
document.querySelectorAll('.panel').forEach(e=>e.classList.remove('active'));
document.getElementById(t).classList.add('active');
}

function mine(){
let p=current();
if(energy<p.energy)return;

energy-=p.energy;

let r=Math.random();
let rareBoost=1+pets[1]*0.05;
let coinBoost=1+pets[2]*0.1;

if(r<p.rare*rareBoost){
inv.gold++;
}else{
inv.stone++;
}

coins+=1*coinBoost;

ui();
save();
}

function upgrade(){
let cost=pick*40;
if(coins<cost)return;

coins-=cost;
if(pick<100)pick++;

ui();
save();
}

function energyBuy(){
if(coins<50)return;
coins-=50;
energy=100;
ui();
save();
}

function pet(id){
if(id==1){
if(coins<100)return;
coins-=100;
pets[1]++;
}
if(id==2){
if(coins<150)return;
coins-=150;
pets[2]++;
}
ui();
save();
}

function sell(){
coins+=inv.stone*2+inv.gold*10;
inv={stone:0,gold:0};
ui();
save();
}

function ui(){
document.getElementById("coins").innerText=coins;
document.getElementById("energy").innerText=energy;
document.getElementById("pick").innerText=pick;
document.getElementById("cost").innerText=pick*40;

document.getElementById("p1").innerText=pets[1];
document.getElementById("p2").innerText=pets[2];
}

function save(){
localStorage.setItem("save",JSON.stringify({coins,energy,pick,inv,pets}));
}

function load(){
let d=JSON.parse(localStorage.getItem("save"));
if(!d)return;
coins=d.coins;
energy=d.energy;
pick=d.pick;
inv=d.inv;
pets=d.pets;
}

setInterval(()=>ui(),500);

load();
ui();
</script>

</body>
</html>
