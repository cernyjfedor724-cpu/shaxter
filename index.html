<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Miner Game FULL</title>

<style>
body { margin:0; font-family:Arial; background:#1c1c1c; color:white; text-align:center; }
.panel { display:none; padding:10px; }
.active { display:block; }
button { margin:5px; padding:10px; border-radius:10px; border:0; background:#333; color:white; }
.tab { display:flex; flex-wrap:wrap; justify-content:center; }
.tab button { flex:1; min-width:80px; }
.box { background:#2a2a2a; margin:5px; padding:10px; border-radius:10px; }
.green { color:#2ecc71; }
.red { color:#e74c3c; }
</style>
</head>

<body>

<h2>⛏️ Miner FULL</h2>

<div class="box">
💰 <span id="coins">0</span> | ⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span><br>
⛏️ Кирка: <span id="pickName"></span>
</div>

<div class="tab">
<button onclick="show('mine')">Шахта</button>
<button onclick="show('shop')">Магазин</button>
<button onclick="show('pets')">Питомцы</button>
<button onclick="show('fortune')">Азарт</button>
</div>

<!-- ШАХТА -->
<div id="mine" class="panel active">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="sell()">💰 Продать</button>
<br><br>
<div id="inv"></div>
<br>
<h4>⛏️ Кирки</h4>
<div id="pickList"></div>
</div>

<!-- МАГАЗИН -->
<div id="shop" class="panel">
<button onclick="buyEnergy()">⚡ энергия +</button>
</div>

<!-- ПИТОМЦЫ -->
<div id="pets" class="panel">
<div class="box">
🐱 Белый чай (lvl <span id="p1lvl">0</span>)<br>
<button onclick="buyPet1()">Купить/апгрейд</button>
</div>

<div class="box">
🐶 Пупуня (lvl <span id="p2lvl">0</span>)<br>
<button onclick="buyPet2()">Купить/апгрейд</button>
</div>
</div>

<!-- ФОРТУНА -->
<div id="fortune" class="panel">
<button onclick="spin()">🎡 Крутить (100)</button>
</div>

<script>
// ---------- ДАННЫЕ ----------
let coins = 100;
let energy = 100;
let maxEnergy = 100;

let inventory = {stone:0, iron:0, gold:0, diamond:0, mithril:0};

let pickLevel = 0;
let activePick = 0;

let pets = {
  p1:0, // белый чай
  p2:0  // пупуня
};

// ---------- 100 КИРОК ----------
let picks = [];
for(let i=0;i<100;i++){
  picks.push({
    name:"Кирка "+(i+1),
    energy: 1 + Math.floor(i/10),
    chance: 0.2 + i*0.002
  });
}

// ---------- ИГРА ----------
function mine(){
  let p = picks[activePick];
  if(energy < p.energy) return;

  energy -= p.energy;

  let bonusRare = pets.p2 * 0.05;
  let chance = Math.random();

  if(chance < 0.5 - bonusRare) inventory.stone++;
  else if(chance < 0.7) inventory.iron++;
  else if(chance < 0.85) inventory.gold++;
  else if(chance < 0.95 + bonusRare) inventory.diamond++;
  else inventory.mithril++;

  // белый чай даёт монеты
  coins += pets.p1;

  save();
  update();
}

function sell(){
  let sum =
    inventory.stone*1 +
    inventory.iron*5 +
    inventory.gold*20 +
    inventory.diamond*100 +
    inventory.mithril*300;

  coins += sum;
  inventory = {stone:0,iron:0,gold:0,diamond:0,mithril:0};

  save();
  update();
}

// ---------- КИРКИ ----------
function buyPick(i){
  activePick = i;
  save();
  update();
}

// ---------- ПИТОМЦЫ ----------
function buyPet1(){
  if(coins < 100*(pets.p1+1)) return;
  coins -= 100*(pets.p1+1);
  pets.p1++;
  save(); update();
}

function buyPet2(){
  if(coins < 200*(pets.p2+1)) return;
  coins -= 200*(pets.p2+1);
  pets.p2++;
  save(); update();
}

// ---------- ЭНЕРГИЯ ----------
function buyEnergy(){
  coins -= 50;
  energy = maxEnergy;
  save(); update();
}

// ---------- ФОРТУНА ----------
function spin(){
  if(coins < 100) return;
  coins -= 100;

  let r = Math.random();
  if(r < 0.2) coins += 200;
  else if(r < 0.4) inventory.diamond++;
  else if(r < 0.6) inventory.gold++;
  else if(r < 0.8) energy = maxEnergy;
  else inventory.mithril++;

  save(); update();
}

// ---------- UI ----------
function update(){
  document.getElementById("coins").innerText = coins;
  document.getElementById("energy").innerText = energy;
  document.getElementById("maxEnergy").innerText = maxEnergy;

  document.getElementById("pickName").innerText = picks[activePick].name;

  document.getElementById("inv").innerHTML =
    `🪨${inventory.stone} ⚙️${inventory.iron} 🥇${inventory.gold} 💎${inventory.diamond} 💠${inventory.mithril}`;

  document.getElementById("p1lvl").innerText = pets.p1;
  document.getElementById("p2lvl").innerText = pets.p2;

  let html = "";
  picks.forEach((p,i)=>{
    html += `<button onclick="buyPick(${i})">${i==activePick?"✅":""}${p.name}</button>`;
  });
  document.getElementById("pickList").innerHTML = html;
}

// ---------- TAB ----------
function show(id){
  document.querySelectorAll(".panel").forEach(e=>e.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ---------- SAVE ----------
function save(){
  localStorage.setItem("game",JSON.stringify({
    coins,energy,maxEnergy,inventory,pets,activePick
  }));
}

function load(){
  let d = JSON.parse(localStorage.getItem("game"));
  if(!d) return;
  coins=d.coins;
  energy=d.energy;
  maxEnergy=d.maxEnergy;
  inventory=d.inventory;
  pets=d.pets;
  activePick=d.activePick;
}

load();
update();
</script>

</body>
</html>
