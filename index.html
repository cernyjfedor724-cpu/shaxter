<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Miner FULL</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;text-align:center}
.panel{padding:10px}
button{padding:10px;margin:5px;border:none;border-radius:10px;background:#333;color:#fff;width:90%}
.hidden{display:none}
.tab{display:flex;flex-wrap:wrap}
.tab button{flex:1}
.stat{background:#222;padding:10px;margin:5px;border-radius:10px}
</style>
</head>
<body>

<div class="stat">
💰 <span id="coins">0</span> |
⛏️ кирка <span id="pick">1</span> |
⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span>
</div>

<div class="tab">
<button onclick="tab('mine')">⛏️</button>
<button onclick="tab('shop')">🛒</button>
<button onclick="tab('pets')">🐾</button>
<button onclick="tab('other')">🎡</button>
</div>

<!-- MINE -->
<div id="mine">
<button onclick="mine()">⛏️ копать</button>
<button onclick="upgrade()">🔨 кирка</button>
<div id="log"></div>
</div>

<!-- SHOP -->
<div id="shop" class="hidden">
<button onclick="sell()">💰 продать</button>
<button onclick="buyEnergy()">⚡ энергия</button>
</div>

<!-- PETS -->
<div id="pets" class="hidden">
<h3>🍵 чай (шанс руды)</h3>
<button onclick="pet('tea')">апгрейд</button>

<h3>🐾 пупуня (монеты)</h3>
<button onclick="pet('pu')">апгрейд</button>
</div>

<!-- OTHER -->
<div id="other" class="hidden">
<button onclick="spin()">🎡 колесо</button>
</div>

<script>

let coins=100
let energy=100
let maxEnergy=100
let pick=1

let inv={s:0,i:0,g:0,d:0,m:0}

let pets={
tea:{lvl:0},
pu:{lvl:0}
}

// ---------- 100 кирок ----------
let P=[]
for(let i=1;i<=100;i++){
P.push({
lvl:i,
energy:2+Math.floor(i/7),
rare:i*0.4
})
}

// ---------- SAVE ----------
function save(){
localStorage.setItem("g",JSON.stringify({coins,energy,maxEnergy,pick,inv,pets}))
}
function load(){
let d=JSON.parse(localStorage.getItem("g"))
if(d){
coins=d.coins
energy=d.energy
maxEnergy=d.maxEnergy
pick=d.pick
inv=d.inv
pets=d.pets
}
}
load()

// ---------- UI ----------
function ui(){
document.getElementById("coins").innerText=coins
document.getElementById("energy").innerText=energy
document.getElementById("maxEnergy").innerText=maxEnergy
document.getElementById("pick").innerText=pick
}
setInterval(ui,300)

// ---------- РЕДКОСТЬ ----------
function rare(){
return pick*0.4 + pets.tea.lvl*2
}

// ---------- МАЙН ----------
function mine(){
let p=P[pick-1]

if(energy<p.energy)return log("нет энергии")

energy-=p.energy

let r=Math.random()*100 + rare()

if(r<60){inv.s++;log("камень")}
else if(r<80){inv.i++;log("железо")}
else if(r<90){inv.g++;log("золото")}
else if(r<97){inv.d++;log("алмаз")}
else{inv.m++;log("мифрил")}

save()
}

// ---------- КИРКА ----------
function upgrade(){
if(pick>=100)return log("макс")

let cost=pick*120
if(coins<cost)return log("нет денег")

coins-=cost
pick++
maxEnergy+=5
energy=maxEnergy

save()
}

// ---------- ПРОДАЖА ----------
function sell(){
let m=
inv.s*1+
inv.i*5+
inv.g*15+
inv.d*50+
inv.m*200

m*=1+pets.pu.lvl*0.2

coins+=m
inv={s:0,i:0,g:0,d:0,m:0}

log("+"+m)
save()
}

// ---------- ЭНЕРГИЯ ----------
function buyEnergy(){
if(coins<50)return
coins-=50
energy=maxEnergy
save()
}

// ---------- ПИТОМЦЫ ----------
function pet(x){
if(coins<200)return
coins-=200
pets[x].lvl++
save()
}

// ---------- КОЛЕСО ----------
function spin(){
if(coins<50)return
coins-=50

let r=Math.random()

if(r<0.3)coins+=100
else if(r<0.6)energy=maxEnergy
else inv.d++

save()
}

// ---------- TAB ----------
function tab(t){
["mine","shop","pets","other"].forEach(x=>{
document.getElementById(x).classList.add("hidden")
})
document.getElementById(t).classList.remove("hidden")
}

// ---------- LOG ----------
function log(t){
document.getElementById("log").innerText=t
}

</script>
</body>
</html>
