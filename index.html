<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⛏️ 100 кирок</title>

<style>
body{background:#1a1a1a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
.stats,.panel{background:#2a2a2a;padding:12px;border-radius:12px;margin:6px 0}
button{width:90%;padding:10px;margin:4px;border-radius:10px;border:none;background:#3a3a3a;color:#fff}
#mineBtn{background:#c4450c;font-size:20px}
.hidden{display:none}
.kirka{background:#333;margin:6px;padding:10px;border-radius:10px}
</style>
</head>

<body>

<div class="stats">
💰 <span id="coins">150</span><br>
⛏️ Кирка: <span id="pickName"></span><br>
⚡ <span id="energy"></span>/<span id="maxEnergy"></span>
</div>

<button id="mineBtn" onclick="mine()">⛏️ Копать</button>
<button onclick="buyPick()">🛒 Купить следующую кирку</button>

<div class="panel">
<h3>🎒 Инвентарь</h3>
🗿 <span id="stone"></span> | ⚙️ <span id="iron"></span> | 💎 <span id="diamond"></span> | 💠 <span id="mithril"></span>
</div>

<div class="panel">
<h3>🔓 Кирки</h3>
<div id="shop"></div>
</div>

<script>

let coins=150;
let energy=100;
let maxEnergy=100;

let currentPick=1;

let inventory={stone:0,iron:0,diamond:0,mithril:0};

// 100 кирок
let PICKS=[];

for(let i=1;i<=100;i++){
PICKS.push({
id:i,
name:"Кирка "+i,
energyCost:1+Math.floor(i/10),
power:1+i*0.15,
rareBoost:Math.min(30,i*0.3)
});
}

function getPick(){
return PICKS[currentPick-1];
}

function mine(){

let pick=getPick();

if(energy<pick.energyCost) return;

energy-=pick.energyCost;

let r=Math.random()*100;

let rareBonus=pick.rareBoost;

let chance=[70,20,8+rareBonus,2+rareBonus];

if(r<chance[0]) inventory.stone++;
else if(r<chance[0]+chance[1]) inventory.iron++;
else if(r<chance[0]+chance[1]+chance[2]) inventory.diamond++;
else inventory.mithril++;

update();
}

function buyPick(){
if(currentPick>=100) return;

let cost=currentPick*50;

if(coins<cost) return;

coins-=cost;
currentPick++;

updateShop();
update();
}

function updateShop(){

let html="";

for(let i=0;i<PICKS.length;i++){

let p=PICKS[i];

html+=`
<div class="kirka">
<b>${p.name}</b><br>
⚡ ${p.energyCost} | 💎 +${p.rareBoost.toFixed(1)}% редких<br>
${i+1<=currentPick?"✅ открыта":"🔒 закрыта"}<br>
</div>
`;

}

document.getElementById("shop").innerHTML=html;

}

function mine(){

let pick=getPick();

if(energy<pick.energyCost) return;

energy-=pick.energyCost;

let r=Math.random()*100;

let chance=[70,20,8+pick.rareBoost,2+pick.rareBoost];

if(r<chance[0]) inventory.stone++;
else if(r<chance[0]+chance[1]) inventory.iron++;
else if(r<chance[0]+chance[1]+chance[2]) inventory.diamond++;
else inventory.mithril++;

update();
}

function update(){

document.getElementById("coins").innerText=coins;
document.getElementById("energy").innerText=energy;
document.getElementById("maxEnergy").innerText=maxEnergy;

document.getElementById("stone").innerText=inventory.stone;
document.getElementById("iron").innerText=inventory.iron;
document.getElementById("diamond").innerText=inventory.diamond;
document.getElementById("mithril").innerText=inventory.mithril;

document.getElementById("pickName").innerText=getPick().name;

updateShop();
}

updateShop();
update();

</script>

</body>
</html>
