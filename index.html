<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Шахтёр</title>

<style>
body{background:#1a1a1a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px;}
.panel{background:#2a2a2a;border-radius:12px;padding:10px;margin:5px 0;}
button{padding:10px;margin:5px;border-radius:10px;border:none;background:#444;color:#fff;width:90%;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="panel">
💰 <span id="coins"></span><br>
⚡ <span id="energy"></span>/<span id="maxEnergy"></span>
</div>

<div class="panel">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="sellAll()">💰 Продать всё</button>
<button onclick="upgradePick()">🔨 Кирка</button>
<button onclick="spin()">🎡 Фортуна</button>
</div>

<div class="panel">
<h3>🐾 Питомцы</h3>
<button onclick="buyPet()">Купить питомца (500)</button>
<div id="petInfo"></div>
</div>

<div class="panel">
<h3>📈 Рынок</h3>
<div id="market"></div>
</div>

<div id="log"></div>

<script>

// --- ДАННЫЕ ---
let coins=150,energy=100,maxEnergy=100,pickLevel=1;
let inventory={stone:0,iron:0,gold:0,diamond:0,mithril:0};

let pet={owned:false,level:0,last:0};

let market={stone:2,iron:8,gold:25,diamond:100,mithril:50};

// --- СОХРАНЕНИЕ ---
function save(){
localStorage.setItem("game",JSON.stringify({coins,energy,maxEnergy,pickLevel,inventory,pet,market}));
}

function load(){
let d=JSON.parse(localStorage.getItem("game"));
if(!d)return;
coins=d.coins||150;
energy=d.energy||100;
maxEnergy=d.maxEnergy||100;
pickLevel=d.pickLevel||1;
inventory=d.inventory||inventory;
pet=d.pet||pet;
market=d.market||market;
}

// --- UI ---
function update(){
coins=Math.max(0,coins);

document.getElementById("coins").innerText=coins;
document.getElementById("energy").innerText=energy;
document.getElementById("maxEnergy").innerText=maxEnergy;

document.getElementById("petInfo").innerText=
pet.owned ? "Уровень: "+pet.level : "Нет питомца";

let html="";
for(let k in market){
html+=k+": "+market[k]+"<br>";
}
document.getElementById("market").innerHTML=html;
}

// --- ЛОГ ---
function log(t){document.getElementById("log").innerText=t;}

// --- КОПКА ---
function mine(){
if(energy<=0){log("Нет энергии");return;}

energy--;

let r=Math.random()*100;
let ore="";

if(r<50){inventory.stone++;}
else if(r<75){inventory.iron++;}
else if(r<90){inventory.gold++;}
else if(r<97){inventory.diamond++;}
else {inventory.mithril++;}

log("Добыча...");

save();update();
}

// --- ПРОДАЖА ---
function sellAll(){
let total=
inventory.stone*market.stone+
inventory.iron*market.iron+
inventory.gold*market.gold+
inventory.diamond*market.diamond+
inventory.mithril*market.mithril;

coins+=total;
inventory={stone:0,iron:0,gold:0,diamond:0,mithril:0};

log("Продано: "+total);

save();update();
}

// --- КИРКА ---
function upgradePick(){
let cost=pickLevel*200;

if(coins<cost){log("Нет денег");return;}

coins-=cost;
pickLevel++;

save();update();
}

// --- ПИТОМЕЦ ---
function buyPet(){
if(pet.owned){log("Уже есть");return;}
if(coins<500){log("Нет денег");return;}

coins-=500;
pet.owned=true;
pet.level=1;
pet.last=Date.now();

save();update();
}

// пассивный доход
setInterval(()=>{
if(pet.owned){
if(Date.now()-pet.last>5000){
coins+=pet.level;
pet.last=Date.now();
}
}
},1000);

// --- ФОРТУНА ---
function spin(){
if(coins<100){log("Нет денег");return;}
coins-=100;

let r=Math.random();

if(r<0.5){coins+=200; log("Выигрыш 200");}
else{log("Проигрыш");}

save();update();
}

// --- РЫНОК ---
setInterval(()=>{
for(let k in market){
market[k]=Math.max(1,Math.round(market[k]*(0.8+Math.random()*0.4)));
}
update();
},10000);

// --- ЭНЕРГИЯ ---
setInterval(()=>{
if(energy<maxEnergy)energy++;
update();
},3000);

// --- СТАРТ ---
load();
update();

</script>

</body>
</html>
