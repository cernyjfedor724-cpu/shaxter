<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Шахтёр</title>

<style>
body {
    background:#1a1a1a;
    color:#e0e0e0;
    font-family:Arial;
    margin:0;
    text-align:center;
}

.panel {
    background:#2a2a2a;
    margin:6px;
    padding:12px;
    border-radius:14px;
}

button {
    background:#3a3a3a;
    color:#fff;
    border:0;
    padding:12px;
    margin:4px;
    border-radius:10px;
    width:90%;
}

button:active {transform:scale(0.98)}

.tab {
    display:flex;
    flex-wrap:wrap;
}

.tab button {
    width:33%;
    font-size:13px;
}

.active {
    background:#c4450c !important;
}

.hidden {display:none}

.bar {
    height:12px;
    background:#333;
    border-radius:8px;
    overflow:hidden;
}

.fill {
    height:100%;
    background:gold;
}
</style>
</head>

<body>

<div class="panel">
<h2>⛏️ ШАХТЁР</h2>
💰 <span id="coins">150</span><br>
⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span><br>
🔨 Кирка: <span id="pick">1</span>
</div>

<div class="tab">
<button onclick="tab('mine')">Шахта</button>
<button onclick="tab('shop')">Магазин</button>
<button onclick="tab('pets')">Питомцы</button>
<button onclick="tab('inv')">Инвентарь</button>
</div>

<div id="mine" class="panel">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="upgradePick()">⬆ Улучшить кирку</button>
<button onclick="buyEnergy()">⚡ Энергия</button>
</div>

<div id="shop" class="panel hidden">
<button onclick="sell()">💰 Продать всё</button>
</div>

<div id="pets" class="panel hidden">

<div class="panel">
🍵 Белый чай (монеты каждые 10 сек)<br>
<button onclick="buyPet1()">Купить 500</button>
</div>

<div class="panel">
🐾 Пупуня (+шанс редкой руды)<br>
<button onclick="buyPet2()">Купить 800</button>
</div>

</div>

<div id="inv" class="panel hidden">
🪨 Камень: <span id="stone">0</span><br>
💎 Алмазы: <span id="diamond">0</span>
</div>

<script>

// ===== CORE =====
let coins=150
let energy=100
let maxEnergy=100
let pick=1

let inv={stone:0,diamond:0}

let pet1=false
let pet2=false

// ===== TAB =====
function tab(t){
document.querySelectorAll('.panel').forEach(e=>e.classList.add('hidden'))
document.getElementById(t).classList.remove('hidden')
}

// ===== MINE =====
function mine(){
if(energy<=0)return

energy--

let r=Math.random()

if(r<0.75)inv.stone++
else inv.diamond++

if(pet2 && Math.random()<0.1)inv.diamond++

update()
}

// ===== UPGRADE =====
function upgradePick(){
if(coins<pick*100)return
coins-=pick*100
pick++
maxEnergy+=5
update()
}

// ===== SELL =====
function sell(){
coins+=inv.stone*2 + inv.diamond*50
inv={stone:0,diamond:0}
update()
}

// ===== ENERGY =====
function buyEnergy(){
if(coins<50)return
coins-=50
energy=maxEnergy
update()
}

// ===== PETS =====
function buyPet1(){
if(coins<500)return
coins-=500
pet1=true

setInterval(()=>{
if(pet1)coins++
},10000)

update()
}

function buyPet2(){
if(coins<800)return
coins-=800
pet2=true
update()
}

// ===== UI =====
function update(){
document.getElementById("coins").innerText=coins
document.getElementById("energy").innerText=energy
document.getElementById("maxEnergy").innerText=maxEnergy
document.getElementById("pick").innerText=pick

document.getElementById("stone").innerText=inv.stone
document.getElementById("diamond").innerText=inv.diamond
}

// ===== ENERGY REGEN =====
setInterval(()=>{
if(energy<maxEnergy)energy++
update()
},1500)

update()

</script>

</body>
</html>
