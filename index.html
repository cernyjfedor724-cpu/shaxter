<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Шахтёр</title>

<style>
body { background:#1a1a1a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px;}
.stats,.panel{background:#2a2a2a;border-radius:15px;padding:10px;margin:5px 0;}
button{padding:10px;margin:5px;border-radius:10px;border:none;background:#444;color:#fff;width:90%;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="stats">
💰 <span id="coins">150</span><br>
⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span>
</div>

<div class="panel">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="sellAll()">💰 Продать всё</button>
<button onclick="upgradePick()">🔨 Улучшить кирку</button>
</div>

<div id="log"></div>

<script>

// --- ДАННЫЕ ---
let coins=150,energy=100,maxEnergy=100,pickLevel=1;
let inventory={stone:0,iron:0,gold:0,diamond:0,mithril:0};

// --- КИРКИ ---
const PICKAXES=[];
for(let i=1;i<=100;i++){
    PICKAXES.push({
        level:i,
        energyCost:Math.min(10,Math.floor(i/10)+1),
        multiChance:Math.min(0.9,(i-1)*0.01),
        maxMulti: i>=90?10:i>=60?5:i>=30?3:2
    });
}

// --- UI ---
function updateUI(){
    document.getElementById('coins').innerText=coins;
    document.getElementById('energy').innerText=energy;
    document.getElementById('maxEnergy').innerText=maxEnergy;
}

// --- ЛОГ ---
function log(t){document.getElementById('log').innerText=t;}

// --- ШАНСЫ ---
function getChances(){
    return [50,25,15,7,3]; // норм
}

// --- КОПКА ---
function mine(){
    let pick=PICKAXES.find(p=>p.level===pickLevel) || PICKAXES[0];

    if(energy<pick.energyCost){
        log("Нет энергии");
        return;
    }

    energy-=pick.energyCost;

    let chances=getChances();
    let r=Math.random()*100;

    let count=1;
    if(Math.random()<pick.multiChance){
        count=Math.floor(Math.random()*pick.maxMulti)+1;
    }

    let ore="";

    if(r<chances[0]){inventory.stone+=count; ore="Камень";}
    else if(r<75){inventory.iron+=count; ore="Железо";}
    else if(r<90){inventory.gold+=count; ore="Золото";}
    else if(r<97){inventory.diamond+=count; ore="Алмаз";}
    else {inventory.mithril+=count; ore="Мифрил";}

    log("Добыто: "+ore+" x"+count);

    updateUI();
}

// --- ПРОДАЖА ---
function sellAll(){
    let total=
    inventory.stone*2+
    inventory.iron*8+
    inventory.gold*25+
    inventory.diamond*100+
    inventory.mithril*50;

    coins+=total;

    inventory={stone:0,iron:0,gold:0,diamond:0,mithril:0};

    log("Продано на "+total);

    updateUI();
}

// --- АПГРЕЙД ---
function upgradePick(){
    let cost=pickLevel*300;

    if(coins<cost){
        log("Не хватает монет");
        return;
    }

    coins-=cost;
    pickLevel++;

    log("Кирка улучшена до "+pickLevel);

    updateUI();
}

// --- ЭНЕРГИЯ ---
setInterval(()=>{
    if(energy<maxEnergy) energy++;
    updateUI();
},3000);

updateUI();

</script>
</body>
</html>
