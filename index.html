<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Шахтёр: Эра Глубин</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== СТИЛИ (те же, что были, без изменений) ===== */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Inter',sans-serif; background:#0b0e1a; color:#fff; min-height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:center; }
        #app { width:100%; max-width:480px; height:100vh; max-height:850px; background:linear-gradient(145deg,#0b0e1a 0%,#1a1f33 100%); border-radius:32px; position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.8); display:flex; flex-direction:column; }
        .header { padding:16px 20px 10px; display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.05); flex-shrink:0; }
        .header .coins { font-size:20px; font-weight:700; color:#f7c948; display:flex; align-items:center; gap:6px; }
        .header .coins span { font-size:14px; color:#aaa; font-weight:400; }
        .header .lang-toggle { display:flex; gap:6px; background:rgba(255,255,255,0.08); border-radius:20px; padding:4px; }
        .header .lang-toggle button { background:transparent; border:none; color:#aaa; font-weight:600; font-size:13px; padding:4px 10px; border-radius:16px; cursor:pointer; transition:0.2s; }
        .header .lang-toggle button.active { background:#f7c948; color:#0b0e1a; }
        .content { flex:1; overflow-y:auto; padding:16px 20px 80px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent; }
        .content::-webkit-scrollbar { width:4px; }
        .content::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:10px; }
        .page { display:none; animation:fadeSlide 0.3s ease; }
        .page.active { display:block; }
        @keyframes fadeSlide { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
        .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(8px); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.06); transition:0.25s; }
        .card:hover { border-color:rgba(247,201,72,0.2); }
        .mine-header { text-align:center; margin-bottom:16px; }
        .mine-header h2 { font-size:22px; font-weight:700; }
        .mine-header .depth { color:#aaa; font-size:14px; }
        .pick-info { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 14px; margin-bottom:12px; flex-wrap:wrap; gap:6px; }
        .pick-name { font-weight:700; font-size:18px; }
        .pick-ores { font-size:12px; color:#aaa; margin-top:2px; }
        .pick-next { font-size:13px; color:#aaa; }
        .pick-cost { font-size:15px; font-weight:600; color:#f7c948; }
        .dig-btn { width:100%; padding:18px; font-size:24px; font-weight:700; border:none; border-radius:20px; background:linear-gradient(135deg,#f7c948,#f5a623); color:#0b0e1a; box-shadow:0 8px 30px rgba(247,201,72,0.3); cursor:pointer; transition:0.15s; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:12px; }
        .dig-btn:active { transform:scale(0.95); box-shadow:0 4px 15px rgba(247,201,72,0.2); }
        .dig-btn:disabled { opacity:0.5; transform:scale(0.98); pointer-events:none; }
        .dig-btn .sparkle { position:absolute; width:6px; height:6px; background:#fff; border-radius:50%; pointer-events:none; animation:sparkleAnim 0.6s ease-out forwards; }
        @keyframes sparkleAnim { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }
        .energy-bar { margin:16px 0; background:rgba(255,255,255,0.08); border-radius:30px; height:12px; overflow:hidden; position:relative; }
        .energy-bar .fill { height:100%; width:100%; background:linear-gradient(90deg,#4dd0e1,#00bcd4); border-radius:30px; transition:width 0.3s ease; }
        .energy-bar .fill.low { background:linear-gradient(90deg,#e74c3c,#f39c12); animation:pulseRed 0.8s infinite alternate; }
        @keyframes pulseRed { 0%{opacity:1} 100%{opacity:0.4} }
        .energy-label { display:flex; justify-content:space-between; font-size:13px; color:#aaa; margin-top:4px; }
        .inventory-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
        .ore-card { background:rgba(255,255,255,0.04); border-radius:12px; padding:10px 6px; text-align:center; border:1px solid rgba(255,255,255,0.05); transition:0.2s; position:relative; }
        .ore-card .icon { font-size:28px; display:block; }
        .ore-card .name { font-size:11px; color:#ccc; margin-top:4px; }
        .ore-card .price { font-size:10px; color:#f7c948; margin-top:2px; }
        .ore-card .count { font-weight:700; font-size:15px; color:#fff; }
        .ore-card .sell-controls { display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px; }
        .ore-card .sell-controls input { width:30px; background:rgba(255,255,255,0.1); border:none; border-radius:6px; color:#fff; text-align:center; font-size:12px; padding:2px; }
        .ore-card .sell-controls button { background:rgba(231,76,60,0.3); border:none; border-radius:6px; color:#e74c3c; font-size:11px; padding:2px 8px; cursor:pointer; }
        .ore-card.rare { border-color:rgba(247,201,72,0.3); }
        .ore-card.epic { border-color:rgba(155,89,182,0.3); }
        .ore-card.legendary { border-color:rgba(241,196,15,0.5); box-shadow:0 0 20px rgba(241,196,15,0.15); }
        .sell-all-btn { margin-top:14px; width:100%; padding:12px; background:rgba(231,76,60,0.2); border:1px solid rgba(231,76,60,0.3); border-radius:14px; color:#e74c3c; font-weight:600; font-size:16px; cursor:pointer; transition:0.2s; }
        .sell-all-btn:active { transform:scale(0.96); background:rgba(231,76,60,0.3); }
        .market-tabs { display:flex; gap:6px; margin-bottom:16px; background:rgba(255,255,255,0.04); border-radius:16px; padding:4px; }
        .market-tabs button { flex:1; padding:8px 0; background:transparent; border:none; border-radius:12px; font-weight:600; font-size:14px; color:#aaa; cursor:pointer; transition:0.2s; }
        .market-tabs button.active { background:rgba(247,201,72,0.2); color:#f7c948; }
        .market-list .item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .market-list .item:last-child { border-bottom:none; }
        .market-list .item .info { display:flex; align-items:center; gap:10px; }
        .market-list .item .info .icon { font-size:24px; }
        .market-list .item .price { color:#f7c948; font-weight:600; }
        .market-list .item .actions button { background:rgba(255,255,255,0.08); border:none; border-radius:8px; padding:4px 12px; color:#fff; font-size:13px; cursor:pointer; transition:0.15s; margin-left:6px; }
        .market-list .item .actions button:active { transform:scale(0.92); }
        .market-list .item .actions .buy { background:rgba(76,175,80,0.25); color:#4caf50; }
        .market-list .item .actions .sell { background:rgba(231,76,60,0.25); color:#e74c3c; }
        .bot-offer { background:rgba(255,255,255,0.03); border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-left:3px solid #f7c948; }
        .bot-offer .bot-info { display:flex; align-items:center; gap:10px; }
        .bot-offer .bot-info .avatar { font-size:28px; }
        .bot-offer .bot-info .desc { font-size:14px; }
        .bot-offer .bot-info .desc small { color:#aaa; display:block; font-size:12px; }
        .bot-offer .accept-btn { background:#f7c948; border:none; border-radius:10px; padding:6px 16px; font-weight:700; color:#0b0e1a; cursor:pointer; transition:0.2s; }
        .bot-offer .accept-btn:active { transform:scale(0.92); }
        .worker-card { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .worker-card .info .name { font-weight:600; }
        .worker-card .info .status { font-size:12px; color:#aaa; }
        .worker-card .hire-btn { background:rgba(76,175,80,0.2); border:1px solid rgba(76,175,80,0.3); border-radius:10px; padding:4px 14px; color:#4caf50; font-weight:600; cursor:pointer; }
        .worker-card .hire-btn:disabled { opacity:0.3; pointer-events:none; }
        .pets-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .pet-card { background:rgba(255,255,255,0.04); border-radius:16px; padding:14px; text-align:center; border:1px solid rgba(255,255,255,0.05); }
        .pet-card .icon { font-size:40px; display:block; margin-bottom:4px; }
        .pet-card .name { font-weight:600; font-size:14px; }
        .pet-card .bonus { font-size:12px; color:#aaa; margin:4px 0; }
        .pet-card .level { font-size:12px; color:#f7c948; }
        .pet-card .upgrade-btn { margin-top:8px; background:rgba(247,201,72,0.15); border:none; border-radius:10px; padding:4px 12px; color:#f7c948; font-weight:600; cursor:pointer; }
        .achievement-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .achievement-item .info .title { font-weight:600; font-size:15px; }
        .achievement-item .info .desc { font-size:12px; color:#aaa; }
        .achievement-item .info .progress { font-size:11px; color:#888; }
        .achievement-item .status { font-size:14px; }
        .achievement-item .status.done { color:#4caf50; }
        .achievement-item .status.locked { color:#888; }
        .settings-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
        .settings-row .label { font-weight:500; }
        .toggle { width:48px; height:28px; background:rgba(255,255,255,0.15); border-radius:30px; position:relative; cursor:pointer; transition:0.25s; }
        .toggle.active { background:#f7c948; }
        .toggle .knob { width:22px; height:22px; background:#fff; border-radius:50%; position:absolute; top:3px; left:3px; transition:0.25s; }
        .toggle.active .knob { left:23px; }
        .donate-btn { background:linear-gradient(135deg,#f7c948,#f5a623); border:none; border-radius:14px; padding:14px; font-weight:700; color:#0b0e1a; font-size:18px; width:100%; cursor:pointer; margin:10px 0; box-shadow:0 4px 20px rgba(247,201,72,0.2); }
        .reset-btn { background:rgba(231,76,60,0.15); border:1px solid rgba(231,76,60,0.2); border-radius:14px; padding:12px; color:#e74c3c; font-weight:600; width:100%; cursor:pointer; }
        .bottom-nav { position:absolute; bottom:0; left:0; right:0; height:70px; background:rgba(11,14,26,0.9); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-around; align-items:center; padding:0 8px; flex-shrink:0; }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; background:transparent; border:none; color:#888; font-size:12px; font-weight:500; cursor:pointer; transition:0.2s; padding:6px 12px; border-radius:12px; position:relative; }
        .nav-item .icon { font-size:24px; line-height:1; }
        .nav-item.active { color:#f7c948; }
        .nav-item.active .icon { transform:translateY(-2px); }
        .nav-item .badge { position:absolute; top:0; right:0; background:#e74c3c; color:#fff; font-size:10px; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-weight:700; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); padding:12px 24px; border-radius:40px; color:#fff; font-weight:500; font-size:15px; border:1px solid rgba(255,255,255,0.08); z-index:1000; opacity:0; transition:0.3s; pointer-events:none; white-space:nowrap; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .chest-modal { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:500; }
        .chest-modal.open { display:flex; }
        .chest-content { background:linear-gradient(145deg,#1a1f33,#0b0e1a); border-radius:30px; padding:30px; max-width:320px; width:90%; text-align:center; border:1px solid rgba(255,255,255,0.08); animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes popIn { 0%{transform:scale(0.7);opacity:0} 100%{transform:scale(1);opacity:1} }
        .chest-content .chest-icon { font-size:60px; animation:chestBounce 0.6s infinite alternate; }
        @keyframes chestBounce { 0%{transform:rotate(-5deg)} 100%{transform:rotate(5deg)} }
        .chest-content .reward { font-size:22px; font-weight:700; margin:10px 0; }
        .chest-content .close-chest { margin-top:16px; background:#f7c948; border:none; border-radius:30px; padding:10px 30px; font-weight:700; color:#0b0e1a; cursor:pointer; }
        .event-banner { background:linear-gradient(90deg,#f7c948,#f5a623); border-radius:12px; padding:10px 14px; margin-bottom:12px; color:#0b0e1a; font-weight:600; display:flex; justify-content:space-between; align-items:center; animation:pulseGold 2s infinite; }
        @keyframes pulseGold { 0%{opacity:1} 50%{opacity:0.7} 100%{opacity:1} }
        .daily-quest { background:rgba(255,255,255,0.04); border-radius:12px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
        .daily-quest .quest-info .title { font-weight:600; font-size:14px; }
        .daily-quest .quest-info .progress { font-size:12px; color:#aaa; }
        .daily-quest .quest-reward { font-size:14px; color:#f7c948; }
        .daily-quest .quest-btn { background:#4caf50; border:none; border-radius:8px; padding:4px 12px; color:#fff; font-weight:600; cursor:pointer; }
        .daily-quest .quest-btn:disabled { opacity:0.3; pointer-events:none; }
        @media (max-width:480px) { #app { border-radius:0; max-height:100vh; } .content { padding:12px 16px 80px; } .inventory-grid { grid-template-columns:repeat(3,1fr); } .pets-grid { grid-template-columns:repeat(2,1fr); } }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <div class="coins">🪙 <span id="coinDisplay">0</span></div>
        <div class="lang-toggle">
            <button class="active" data-lang="ru">RU</button>
            <button data-lang="en">EN</button>
        </div>
    </div>
    <div class="content" id="content">
        <!-- Шахта -->
        <div class="page active" id="page-mine">
            <div class="mine-header">
                <h2 id="mineTitle">⛏️ Шахта</h2>
                <div class="depth" id="depthDisplay">Уровень: 1</div>
            </div>
            <div id="eventBanner" class="event-banner" style="display:none;"></div>
            <div id="dailyQuestsContainer"></div>
            <div class="pick-info">
                <div>
                    <div class="pick-name" id="currentPickName">Деревянная кирка</div>
                    <div class="pick-ores" id="pickOresList">🪨 камень</div>
                </div>
                <div style="text-align:right;">
                    <div class="pick-next" id="nextPickHint">Следующая: Каменная</div>
                    <div class="pick-cost" id="pickUpgradeCost">Цена: 100 🪙</div>
                </div>
            </div>
            <button class="dig-btn" id="digBtn">⛏️ Копать</button>
            <div class="energy-bar">
                <div class="fill" id="energyFill" style="width:100%"></div>
            </div>
            <div class="energy-label">
                <span id="energyText">⚡ 100/100</span>
                <span id="energyRegen">+3/сек</span>
            </div>
            <div style="margin-top:12px; display:flex; gap:8px;">
                <button id="upgradePickBtn" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px; color:#fff; font-weight:600;">🔨 Улучшить</button>
                <button id="upgradeMineBtn" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px; color:#fff; font-weight:600;">🏚️ Уровень шахты</button>
            </div>
            <div style="margin-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:600;">🎒 Инвентарь</span>
                    <span style="font-size:13px; color:#aaa;" id="inventoryCapacity">0/50</span>
                </div>
                <div class="inventory-grid" id="inventoryGrid"></div>
                <button class="sell-all-btn" id="sellAllBtn">💰 Продать всё</button>
            </div>
        </div>

        <!-- Рынок -->
        <div class="page" id="page-market">
            <div class="market-tabs">
                <button class="active" data-mtab="exchange">📊 Биржа</button>
                <button data-mtab="players">🤝 Игроки</button>
                <button data-mtab="guild">🏛️ Гильдия</button>
            </div>
            <div id="marketContent">
                <div class="market-tab active" data-mtab="exchange">
                    <div class="market-list" id="exchangeList"></div>
                    <h4 style="margin:16px 0 8px;">🤖 Предложения ботов</h4>
                    <div id="botOffers"></div>
                </div>
                <div class="market-tab" data-mtab="players" style="display:none;">
                    <div style="margin-bottom:12px;">
                        <input type="text" id="playerOfferOre" placeholder="Руда" style="width:40%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                        <input type="number" id="playerOfferAmount" placeholder="Кол-во" style="width:25%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                        <input type="number" id="playerOfferPrice" placeholder="Цена" style="width:25%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff;">
                        <button id="publishOfferBtn" style="background:#f7c948; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#0b0e1a;">Выставить</button>
                    </div>
                    <div id="playerOffersList"></div>
                </div>
                <div class="market-tab" data-mtab="guild" style="display:none;">
                    <div style="margin-bottom:12px;">
                        <input type="text" id="guildNameInput" placeholder="Название гильдии" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; width:60%;">
                        <button id="createGuildBtn" style="background:#f7c948; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#0b0e1a;">Создать</button>
                    </div>
                    <div id="guildInfo">Гильдия не создана</div>
                    <div id="guildMembers"></div>
                    <div style="margin-top:12px;">
                        <h4>Обмен в гильдии</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="guildTradeOre" placeholder="Руда" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; flex:1;">
                            <input type="number" id="guildTradeAmount" placeholder="Кол-во" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:6px; color:#fff; flex:1;">
                            <button id="guildTradeBtn" style="background:#4caf50; border:none; border-radius:8px; padding:6px 12px; font-weight:700; color:#fff;">Отдать</button>
                        </div>
                        <div id="guildStorage"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Рабочие -->
        <div class="page" id="page-workers">
            <div id="workersList"></div>
        </div>

        <!-- Питомцы -->
        <div class="page" id="page-pets">
            <div class="pets-grid" id="petsGrid"></div>
        </div>

        <!-- Достижения -->
        <div class="page" id="page-achievements">
            <div id="achievementsList"></div>
        </div>

        <!-- Настройки -->
        <div class="page" id="page-settings">
            <div class="settings-row">
                <span class="label">🌓 Тёмная тема</span>
                <div class="toggle active" id="themeToggle"><div class="knob"></div></div>
            </div>
            <div class="settings-row">
                <span class="label">📳 Вибрация</span>
                <div class="toggle active" id="vibrationToggle"><div class="knob"></div></div>
            </div>
            <button class="donate-btn" id="donateBtn">⭐ Поддержать (Донат)</button>
            <button class="reset-btn" id="resetBtn">🗑️ Сбросить прогресс</button>
            <div style="margin-top:12px; text-align:center; color:#555; font-size:12px;">
                <span id="totalClicks">Кликов: 0</span> · <span id="totalTime">Время: 0ч</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" data-page="mine"><span class="icon">🏠</span><span>Шахта</span></button>
        <button class="nav-item" data-page="market"><span class="icon">📊</span><span>Рынок</span></button>
        <button class="nav-item" data-page="workers"><span class="icon">👷</span><span>Рабочие</span></button>
        <button class="nav-item" data-page="pets"><span class="icon">🐾</span><span>Питомцы</span></button>
        <button class="nav-item" data-page="achievements"><span class="icon">🏆</span><span>Достижения</span></button>

// ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
function t(key) { return LANG[game.lang]?.[key] || key; }
function getOrePrice(ore) {
    const base = ORES[ore]?.basePrice || 1;
    const market = game.marketPrices[ore] || 1;
    return Math.floor(base * market);
}
function getInventoryTotal() {
    let sum=0; for(let ore in game.inventory) sum+=game.inventory[ore];
    return sum;
}
function getMaxInventory() { return 50 + game.mineLevel*10; }
function pickOreByChance(chances) {
    const r=Math.random(); let cum=0;
    for(let ore in chances) { cum+=chances[ore]; if(r<=cum) return ore; }
    return 'камень';
}
function showToast(text) {
    const el=document.getElementById('toast');
    el.textContent=text; el.classList.add('show');
    clearTimeout(toastTimeout); toastTimeout=setTimeout(()=>el.classList.remove('show'),2500);
}
let toastTimeout;

let audioCtx = null;
function playSound(type) {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = type==='click'?800:type==='chest'?1200:type==='achievement'?1400:600;
        gain.gain.value = 0.1;
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } catch(e) {}
}

// ----- СОХРАНЕНИЕ -----
function saveGame() {
    game.lastSave=Date.now();
    localStorage.setItem('shaxterSave',JSON.stringify(game));
}
function loadGame() {
    const raw=localStorage.getItem('shaxterSave');
    if(raw) {
        try {
            const saved=JSON.parse(raw);
            for(let key in saved) {
                if(game.hasOwnProperty(key)) {
                    if(typeof game[key]==='object' && game[key]!==null && !Array.isArray(game[key]))
                        game[key]={...game[key],...saved[key]};
                    else game[key]=saved[key];
                }
            }
            const diff=(Date.now()-game.lastSave)/1000;
            const regen=diff*3;
            game.energy=Math.min(game.maxEnergy, game.energy+regen);
            if(game.workers.length>0) {
                let offlineOre={};
                game.workers.forEach(w=>{
                    const wt=WORKER_TYPES.find(t=>t.id===w.type);
                    if(!wt) return;
                    const speed=w.speed||wt.baseSpeed;
                    const cycles=Math.floor(diff/speed);
                    for(let i=0;i<cycles;i++) {
                        const ore=pickOreByChance(w.oreChance||wt.oreChance);
                        if(ore) offlineOre[ore]=(offlineOre[ore]||0)+1;
                    }
                });
                for(let ore in offlineOre) {
                    if(game.inventory[ore]!==undefined) game.inventory[ore]+=offlineOre[ore];
                }
                if(Object.keys(offlineOre).length>0) showToast('⛏️ Рабочие накопали ресурсов!');
            }
            saveGame();
        } catch(e) {}
    }
}

// ----- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ -----
function resetDailyQuestsIfNeeded() {
    const now=Date.now();
    const last=game.lastQuestReset||0;
    const today=new Date(); today.setHours(0,0,0,0);
    const resetTime=today.getTime();
    if(now - last > 86400000 || last < resetTime) {
        const questTemplates = [
            { type:'mine', target:50, ore:'камень', reward:100, desc:'Добыть 50 камня' },
            { type:'mine', target:30, ore:'железо', reward:150, desc:'Добыть 30 железа' },
            { type:'mine', target:20, ore:'золото', reward:200, desc:'Добыть 20 золота' },
            { type:'sell', target:10, ore:'алмаз', reward:300, desc:'Продать 10 алмазов' },
            { type:'sell', target:5, ore:'мифрил', reward:400, desc:'Продать 5 мифрила' },
            { type:'upgrade', target:1, reward:250, desc:'Улучшить кирку' },
            { type:'mine', target:100, ore:'камень', reward:200, desc:'Добыть 100 камня' }
        ];
        const shuffled = [...questTemplates].sort(()=>Math.random()-0.5);
        const selected = shuffled.slice(0,3).map((q,idx)=>({
            id:'quest_'+Date.now()+'_'+idx,
            type:q.type, target:q.target, ore:q.ore||null, reward:q.reward,
            desc:q.desc, current:0, completed:false, rewarded:false
        }));
        game.dailyQuests=selected;
        game.lastQuestReset=now;
    }
}
function updateDailyQuests() {
    game.dailyQuests.forEach(q=>{
        if(q.completed) return;
        if(q.type==='mine') q.current=game.inventory[q.ore]||0;
        else if(q.type==='upgrade') q.current=game.currentPickIndex+1;
        if(q.current>=q.target) q.completed=true;
    });
}

// ----- ШАНСЫ РУД -----
function getOreChances() {
    const pick = PICKAXES[game.currentPickIndex] || PICKAXES[0];
    const available = pick.unlockOres;
    let base={};
    const count=available.length;
    available.forEach(ore=>{ base[ore]=1/count; });
    const rareBonus=pick.rareBonus||0;
    const rareOres=['алмаз','мифрил','платина','рубин','изумруд','обсидиан','опал','звёздная_пыль'];
    rareOres.forEach(ore=>{ if(base[ore]!==undefined) base[ore]+=rareBonus*0.15; });
    let sum=0; for(let o in base) sum+=base[o];
    for(let o in base) base[o]/=sum;
    return base;
}

// ----- ОТРИСОВКА (без saveGame) -----
function renderAll() {
    renderCoins();
    renderEnergy();
    renderInventory();
    renderMineInfo();
    renderPickInfo();
    renderMarketExchange();
    renderBotOffers();
    renderWorkers();
    renderPets();
    renderAchievements();
    renderSettings();
    renderPlayerOffers();
    renderGuild();
    renderDailyQuests();
    renderEventBanner();
    // saveGame() удалён – сохранение только по таймеру и в действиях
}

function renderCoins() {
    const el=document.getElementById('coinDisplay');
    const val=Math.floor(game.coins);
    if(el.textContent!=val) el.textContent=val;
}
function renderEnergy() {
    const fill=document.getElementById('energyFill');
    const pct=(game.energy/game.maxEnergy)*100;
    const newWidth=Math.min(100,pct)+'%';
    if(fill.style.width!=newWidth) fill.style.width=newWidth;
    if(pct<20) fill.classList.add('low'); else fill.classList.remove('low');
    document.getElementById('energyText').textContent=`⚡ ${Math.floor(game.energy)}/${game.maxEnergy}`;
    document.getElementById('digBtn').disabled=(game.energy<1 || getInventoryTotal()>=getMaxInventory());
}
function renderInventory() {
    const grid=document.getElementById('inventoryGrid');
    let html=''; let total=0;
    for(let ore in game.inventory) {
        const count=game.inventory[ore];
        if(count>0) {
            total+=count;
            const price=getOrePrice(ore);
            const rarity=ORES[ore]?.rarity||'common';
            let cls='ore-card';
            if(rarity==='rare') cls+=' rare';
            if(rarity==='epic') cls+=' epic';
            if(rarity==='legendary'||rarity==='mythic') cls+=' legendary';
            html+=`<div class="${cls}">
                <span class="icon">${ORES[ore]?.icon||'🪨'}</span>
                <div class="name">${ore}</div>
                <div class="price">${price} 🪙</div>
                <div class="count">${count}</div>
                <div class="sell-controls">
                    <input type="number" id="sellAmt_${ore}" value="1" min="1" max="${count}" style="width:40px;">
                    <button data-ore="${ore}" data-action="sellOne">Продать</button>
                </div>
            </div>`;
        }
    }
    grid.innerHTML=html;
    document.getElementById('inventoryCapacity').textContent=`${total}/${getMaxInventory()}`;
    grid.querySelectorAll('button[data-action="sellOne"]').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const ore=btn.dataset.ore;
            const inp=document.getElementById('sellAmt_'+ore);
            let amt=parseInt(inp.value)||1;
            if(amt<1) amt=1;
            if(amt>game.inventory[ore]) amt=game.inventory[ore];
            if(amt<=0) return;
            const price=getOrePrice(ore);
            const tax=Math.floor(price*0.05);
            const final=price-tax;
            const totalCoins=final*amt;
            game.inventory[ore]-=amt;
            game.coins+=totalCoins;
            showToast(`Продано ${amt} ${ore} за ${totalCoins} 🪙 (налог ${tax*amt})`);
            game.dailyQuests.forEach(q=>{ if(q.type==='sell'&&q.ore===ore&&!q.completed){ q.current+=amt; if(q.current>=q.target) q.completed=true; } });
            renderAll(); saveGame();
        });
    });
}
function renderMineInfo() {
    document.getElementById('depthDisplay').textContent=t('depth')+' '+game.mineLevel;
    let mutation='';
    if(game.pickMutation==='fire') mutation='🔥';
    else if(game.pickMutation==='ice') mutation='❄️';
    else if(game.pickMutation==='gold') mutation='⭐';
    document.getElementById('mineTitle').innerHTML=t('mine')+' '+mutation;
}
function renderPickInfo() {
    const pick = PICKAXES[game.currentPickIndex] || PICKAXES[0];
    const nextIndex=game.currentPickIndex+1;
    document.getElementById('currentPickName').textContent=t(pick.nameKey);
    const oresList=pick.unlockOres.map(o=>ORES[o]?.icon||'🪨').join(' ');
    document.getElementById('pickOresList').textContent=oresList;
    if(nextIndex<PICKAXES.length) {
        const next=PICKAXES[nextIndex];
        const cost=Math.floor(100*Math.pow(1.8, game.currentPickIndex));
        document.getElementById('nextPickHint').textContent=t('next')+' '+t(next.nameKey);
        document.getElementById('pickUpgradeCost').textContent=t('price')+' '+cost+' 🪙';
        document.getElementById('upgradePickBtn').innerHTML='🔨 '+t('upgrade')+' ('+cost+' 🪙)';
        document.getElementById('upgradePickBtn').disabled=false;
    } else {
        document.getElementById('nextPickHint').textContent='⭐ '+t('max');
        document.getElementById('pickUpgradeCost').textContent=t('max');
        document.getElementById('upgradePickBtn').innerHTML='🔨 '+t('max');
        document.getElementById('upgradePickBtn').disabled=true;
    }
}
function renderMarketExchange() {
    const list=document.getElementById('exchangeList');
    let html='';
    for(let ore in ORES) {
        const price=getOrePrice(ore);
        html+=`<div class="item">
            <div class="info"><span class="icon">${ORES[ore].icon}</span><span>${ore}</span></div>
            <div class="price">${price} 🪙</div>
            <div class="actions">
                <button class="buy" data-ore="${ore}">${t('buy')}</button>
                <button class="sell" data-ore="${ore}">${t('sell')}</button>
            </div>
        </div>`;
    }
    list.innerHTML=html;
    list.querySelectorAll('.buy').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const ore=btn.dataset.ore;
            const price=getOrePrice(ore);
            if(game.coins>=price) { game.coins-=price; game.inventory[ore]=(game.inventory[ore]||0)+1; showToast(`Куплен ${ore} за ${price} монет`); renderAll(); saveGame(); }
            else showToast('❌ Недостаточно монет');
        });
    });
    list.querySelectorAll('.sell').forEach(btn=>{

function dig() {
    if(game.energy<1 || getInventoryTotal()>=getMaxInventory()) return;
    game.energy--;
    game.totalClicks++;
    if(Math.random()<0.03) openChest();
    const chances=getOreChances();
    let ore='камень';
    const r=Math.random(); let cum=0;
    for(let o in chances) { cum+=chances[o]; if(r<=cum){ ore=o; break; } }
    let multiplier=PICKAXES[game.currentPickIndex]?.baseMultiplier||1;
    if(game.pickMutation==='fire') {
        if(['алмаз','мифрил','платина','рубин','изумруд','обсидиан','опал','звёздная_пыль'].includes(ore)) multiplier*=1.5;
    } else if(game.pickMutation==='ice') multiplier*=1.3;
    else if(game.pickMutation==='gold') { multiplier*=1.8; game.coins+=Math.floor(Math.random()*5); }
    if(game.activeEvent && game.activeEvent.endTime > Date.now()) {
        if(game.activeEvent.type==='gold_rush' && ore==='золото') multiplier*=1.5;
        if(game.activeEvent.type==='deep_dark') {
            if(['алмаз','мифрил','платина','рубин','изумруд','обсидиан','опал','звёздная_пыль'].includes(ore)) multiplier*=1.3;
        }
    }
    const count=Math.floor(1+Math.random()*multiplier);
    game.inventory[ore]=(game.inventory[ore]||0)+count;
    spawnSparks();
    showToast(`+${count} ${ORES[ore]?.icon||'🪨'} ${ore}`);
    game.dailyQuests.forEach(q=>{ if(q.type==='mine'&&q.ore===ore&&!q.completed){ q.current+=count; if(q.current>=q.target) q.completed=true; } });
    playSound('click');
    renderAll();
    saveGame();
}
function spawnSparks() {
    const btn=document.getElementById('digBtn');
    for(let i=0;i<12;i++) {
        const spark=document.createElement('div');
        spark.className='sparkle';
        const angle=Math.random()*2*Math.PI;
        const dist=40+Math.random()*80;
        spark.style.setProperty('--tx', Math.cos(angle)*dist+'px');
        spark.style.setProperty('--ty', Math.sin(angle)*dist+'px');
        spark.style.left=(50+(Math.random()-0.5)*20)+'%';
        spark.style.top=(50+(Math.random()-0.5)*20)+'%';
        btn.appendChild(spark);
        setTimeout(()=>spark.remove(),600);
    }
}
function openChest() {
    const modal=document.getElementById('chestModal');
    modal.classList.add('open');
    const rewards=[
        { text:'+100 монет', action:()=>game.coins+=100 },
        { text:'+1 алмаз', action:()=>game.inventory.алмаз=(game.inventory.алмаз||0)+1 },
        { text:'+1 мифрил', action:()=>game.inventory.мифрил=(game.inventory.мифрил||0)+1 },
        { text:'+5 платины', action:()=>game.inventory.платина=(game.inventory.платина||0)+5 },
        { text:'+1 звёздная пыль', action:()=>game.inventory.звёздная_пыль=(game.inventory.звёздная_пыль||0)+1 },
        { text:'+500 монет', action:()=>game.coins+=500 }
    ];
    const chosen=rewards[Math.floor(Math.random()*rewards.length)];
    document.getElementById('chestReward').textContent=chosen.text;
    chosen.action();
    playSound('chest');
    renderAll();
    saveGame();
    document.getElementById('closeChest').onclick=()=>{ modal.classList.remove('open'); };
}
function upgradePick() {
    const nextIndex=game.currentPickIndex+1;
    if(nextIndex>=PICKAXES.length) { showToast('🔥 '+t('max')); return; }
    const cost=Math.floor(100*Math.pow(1.8, game.currentPickIndex));
    if(game.coins>=cost) {
        game.coins-=cost;
        game.currentPickIndex=nextIndex;
        if(Math.random()<0.05) {
            const mutations=['fire','ice','gold'];
            game.pickMutation=mutations[Math.floor(Math.random()*mutations.length)];
            showToast(`✨ Кирка стала ${game.pickMutation==='fire'?'Огненной':game.pickMutation==='ice'?'Ледяной':'Золотой'}!`);
        }
        showToast(`🔨 Получена ${t(PICKAXES[nextIndex].nameKey)}!`);
        game.dailyQuests.forEach(q=>{ if(q.type==='upgrade'&&!q.completed){ q.current=game.currentPickIndex+1; if(q.current>=q.target) q.completed=true; } });
        renderAll(); saveGame();
    } else showToast('❌ Недостаточно монет');
}
function upgradeMine() {
    const cost=Math.floor(200*Math.pow(1.6, game.mineLevel));
    if(game.coins>=cost) {
        game.coins-=cost;
        game.mineLevel++;
        showToast(`🏚️ Шахта улучшена до ${game.mineLevel} уровня`);
        renderAll(); saveGame();
    } else showToast('❌ Недостаточно монет');
}
function sellAll() {
    let total=0;
    for(let ore in game.inventory) {
        if(game.inventory[ore]>0) {
            total+=game.inventory[ore]*getOrePrice(ore);
            game.inventory[ore]=0;
        }
    }
    if(total>0) {
        total=Math.floor(total*0.95);
        game.coins+=total;
        showToast(`💰 Продано на ${total} монет`);
        game.dailyQuests.forEach(q=>{ if(q.type==='sell'&&!q.completed){ q.current+=1; if(q.current>=q.target) q.completed=true; } });
        renderAll(); saveGame();
    } else showToast('❌ Инвентарь пуст');
}
function updateMarketPrices() {
    for(let ore in ORES) {
        game.marketPrices[ore] = 0.8 + Math.random()*0.4;
    }
}

setInterval(()=>{
    game.workers.forEach(w=>{
        const wt=WORKER_TYPES.find(t=>t.id===w.type);
        if(!wt) return;
        const speed=wt.baseSpeed/(1+w.level*0.1);
        if(Math.random()<1/speed) {
            const ore=pickOreByChance(w.oreChance);
            if(ore && getInventoryTotal()<getMaxInventory()) {
                game.inventory[ore]=(game.inventory[ore]||0)+1;
            }
        }
    });
    resetDailyQuestsIfNeeded();
    updateDailyQuests();
    if(game.activeEvent && game.activeEvent.endTime < Date.now()) {
        game.activeEvent=null;
        showToast('Событие завершено!');
    }
    if(!game.activeEvent && Math.random()<0.005) {
        const types=['gold_rush','deep_dark'];
        const type=types[Math.floor(Math.random()*types.length)];
        game.activeEvent={ type, endTime: Date.now()+2*24*60*60*1000 };
        showToast(`🎉 Событие "${type==='gold_rush'?'Золотая лихорадка':'Тёмные глубины'}" началось!`);
        renderAll();
    }
    renderAll();
    saveGame();
},1000);

// Рынок – обновление цен каждые 10 минут
setInterval(()=>{
    updateMarketPrices();
    showToast('📊 Цены на рынке обновлены!');
    renderAll();
},600000);

// Боты – обновление раз в 30 секунд
setInterval(()=>{
    game.botOffers=game.botOffers.filter(b=>b.expires>Date.now());
    if(game.botOffers.length<5) {
        const oreKeys=Object.keys(ORES);
        const ore=oreKeys[Math.floor(Math.random()*oreKeys.length)];
        const amount=Math.floor(Math.random()*5)+1;
        const price=getOrePrice(ore)*amount*(0.8+Math.random()*0.4);
        game.botOffers.push({
            ore, amount, price:Math.floor(price),
            botName:['Торговец','Купец','Барыга','Спекулянт'][Math.floor(Math.random()*4)],
            avatar:['🧑‍💼','👨‍💼','👩‍💼','🤵'][Math.floor(Math.random()*4)],
            expires:Date.now()+60000
        });
        renderAll();
    }
},30000);

// Время игры – обновление каждую секунду
setInterval(()=>{
    game.totalTime++;
    renderAll();
},1000);

// Автосохранение каждые 15 секунд
setInterval(saveGame,15000);

// ===== ИНИЦИАЛИЗАЦИЯ =====
loadGame();
resetDailyQuestsIfNeeded();  // <-- добавлено, чтобы создать задания для нового игрока
// Инициализируем рыночные цены (без вызова updateMarketPrices, чтобы не сбивать)
for(let ore in ORES) {
    if(!game.marketPrices[ore]) game.marketPrices[ore] = 1.0;
}
renderAll();
console.log('⛏️ Шахтёр: Эра Глубин (финальная исправленная) загружена!');
</script>
