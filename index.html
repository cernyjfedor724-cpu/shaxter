<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Шахтёр</title>

<style>
body{background:#1a1a1a;color:#eee;font-family:Arial;margin:0;padding:10px;text-align:center;}
.panel{background:#2a2a2a;border-radius:12px;padding:10px;margin:6px 0;}
button{padding:10px;margin:4px;border:none;border-radius:10px;background:#444;color:#fff;width:90%;}
.tab{display:flex;flex-wrap:wrap;}
.tab button{flex:1;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="panel">
💰 <span id="coins"></span><br>
🔨 Ур. <span id="pickLevel"></span><br>
⚡ <span id="energy"></span>/<span id="maxEnergy"></span>
</div>

<div class="tab">
<button onclick="tab('mine')">⛏️</button>
<button onclick="tab('market')">📈</button>
<button onclick="tab('shop')">🛒</button>
<button onclick="tab('fortune')">🎡</button>
<button onclick="tab('pets')">🐾</button>
<button onclick="tab('ach')">🏆</button>
</div>

<div id="mine" class="panel">
<button onclick="mine()">⛏️ Копать</button>
<button onclick="sellAll()">💰 Продать</button>
<button onclick="upgradePick()">🔨 Улучшить</button>
<button onclick="buyEnergy()">⚡ Энергия</button>
</div>

<div id="market" class="panel hidden"></div>

<div id="shop" class="panel hidden">
<button onclick="buyBuff('ore')">x2 руда (150)</button>
<button onclick="buyBuff('sell')">x2 продажа (200)</button>
<div id="buffs"></div>
</div>

<div id="fortune" class="panel hidden">
<button onclick="spin()">🎡 100</button>
<input id="inv" placeholder="сумма">
<button onclick="invest()">инвест</button>
</div>

<div id="pets" class="panel hidden">
<button onclick="buyPet('p1')">чай (500)</button>
<button onclick="buyPet('p2')">пупуня (800)</button>
<div id="petsInfo"></div>
</div>

<div id="ach" class="panel hidden">
<div id="ach1">❌ 10 камня</div>
<div id="ach2">❌ алмаз</div>
</div>

<div id="log"></div>

<script>

// --- ДАННЫЕ ---
let coins=150,energy=100,maxEnergy=100,pickLevel=1;
let inv={stone:0,iron:0,gold:0,diamond:0,mithril:0};
let totalStone=0,diamondFound=false;

let buffs={ore:false,sell:false,oreEnd:0,sellEnd:0};

let pets={
p1:{owned:false,lvl:0,last:0},
p2:{owned:false,lvl:0}
};

let market={stone:2,iron:8,gold:25,diamond:100,mithril:50};

// --- СОХРАНЕНИЕ ---
function save(){
localStorage.setItem("miner",JSON.stringify({coins,energy,maxEnergy,pickLevel,inv,pets,market,totalStone,diamondFound}));
}
function load(){
let d=JSON.parse(localStorage.getItem("miner"));
if(!d)return;
Object.assign(window,d);
}

// --- UI ---
function update(){
coins=Math.max(0,coins);

coinsEl.innerText=coins;
energyEl.innerText=energy;
maxEnergyEl.innerText=maxEnergy;
pickLevelEl.innerText=pickLevel;

let m="";
for(let k in market) m+=k+": "+market[k]+"<br>";
marketEl.innerHTML=m;

petsInfo.innerText=
(pets.p1.owned?"чай lvl "+pets.p1.lvl:"")+"\n"+
(pets.p2.owned?"пупуня lvl "+pets.p2.lvl:"");

ach1.innerText=(totalStone>=10?"✅":"❌")+" 10 камня";
ach2.innerText=(diamondFound?"✅":"❌")+" алмаз";
}

// --- ТАБЫ ---
function tab(t){
["mine","market","shop","fortune","pets","ach"]
.forEach(x=>document.getElementById(x).classList.add("hidden"));
document.getElementById(t).classList.remove("hidden");
}

// --- КОПКА ---
function mine(){
if(energy<=0){log("нет энергии");return;}
energy--;

let count=buffs.ore?2:1;

let r=Math.random()*100;
if(r<50){inv.stone+=count;totalStone+=count;}
else if(r<75){inv.iron+=count;}
else if(r<90){inv.gold+=count;}
else if(r<97){inv.diamond+=count;diamondFound=true;}
else inv.mithril+=count;

log("добыча");

save();update();
}

// --- ПРОДАЖА ---
function sellAll(){
let total=
inv.stone*market.stone+
inv.iron*market.iron+
inv.gold*market.gold+
inv.diamond*market.diamond+
inv.mithril*market.mithril;

if(buffs.sell) total*=2;

coins+=total;
inv={stone:0,iron:0,gold:0,diamond:0,mithril:0};

log("+"+total);

save();update();
}

// --- КИРКА ---
function upgradePick(){
let cost=pickLevel*300;
if(coins<cost){log("нет денег");return;}
coins-=cost;pickLevel++;
save();update();
}

// --- ЭНЕРГИЯ ---
function buyEnergy(){
if(coins<50)return;
coins-=50;energy=maxEnergy;
save();update();
}
setInterval(()=>{if(energy<maxEnergy)energy++;update();},3000);

// --- БАФФЫ ---
function buyBuff(t){
if(t==="ore" && coins>=150){
coins-=150;buffs.ore=true;buffs.oreEnd=Date.now()+30000;
}
if(t==="sell" && coins>=200){
coins-=200;buffs.sell=true;buffs.sellEnd=Date.now()+30000;
}
save();update();
}

setInterval(()=>{
let now=Date.now();
if(buffs.ore && now>buffs.oreEnd) buffs.ore=false;
if(buffs.sell && now>buffs.sellEnd) buffs.sell=false;
},1000);

// --- ФОРТУНА ---
function spin(){
if(coins<100)return;
coins-=100;
if(Math.random()<0.5) coins+=200;
save();update();
}

// --- ИНВЕСТ ---
function invest(){
let a=parseInt(invInput.value);
if(!a||coins<a)return;
if(Math.random()<0.5) coins+=a;
else coins-=a;
invInput.value="";
save();update();
}

// --- ПИТОМЦЫ ---
function buyPet(k){
let cost=k==="p1"?500:800;
if(coins<cost)return;
coins-=cost;
pets[k].owned=true;
pets[k].lvl=1;
pets[k].last=Date.now();
save();update();
}

setInterval(()=>{
if(pets.p1.owned){
if(Date.now()-pets.p1.last>5000){
coins+=pets.p1.lvl;
pets.p1.last=Date.now();
}
}
},1000);

// --- РЫНОК ---
setInterval(()=>{
for(let k in market){
market[k]=Math.max(1,Math.round(market[k]*(0.8+Math.random()*0.4)));
}
update();
},10000);

// --- ЛОГ ---
function log(t){document.getElementById("log").innerText=t;}

// --- СТАРТ ---
load();
update();

</script>

</body>
</html>
